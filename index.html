<!DOCTYPE html>
<!-- BIOFIX_PANEL_V11_CATALOGO_PEDIDOS_DESDE_FORMULARIO -->
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
  :root {
    --petrol: #061a24;
    --petrol-hover: #0b2632;
    --red: #c8162e;
    --red-hover: #a91227;
    --ink: #1b2a30;
    --muted: #6d7c82;
    --line: #dce4e7;
    --line-soft: #e8eef0;
    --bg: #f4f7f8;
    --surface: #fff;
    --blue-soft: #eaf3ff;
    --blue: #2366b1;
    --red-soft: #fce9ec;
    --green-soft: #e9f6ef;
    --green: #247a56;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); background: var(--bg); font-family: Inter, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin-top: 0; }
  .brandbar {
    height: 72px; padding: 0 36px; color: #fff; background: var(--petrol);
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(3,21,29,.18);
  }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 19px; }
  .brand strong { font-weight: 750; }
  .brand span { font-weight: 400; }
  .brand-mark { width: 36px; height: 36px; margin-right: 7px; border: 1px solid #fff; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 850; }
  .profile { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
  .profile-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--petrol); font-size: 13px; }
  .module-nav {
    height: 56px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: thin;
  }
  .nav-item {
    flex: 0 0 auto; min-width: max-content; padding: 0 19px; border: 0; border-bottom: 4px solid transparent;
    color: #31434a; background: transparent; font-size: 14px; font-weight: 550; transition: 160ms ease-out;
  }
  .nav-item:hover { background: #f7f9fa; }
  .nav-item.active { color: var(--ink); border-bottom-color: var(--red); font-weight: 700; }
  .main { width: min(100%, 1440px); margin: 0 auto; }
  .page-header { min-height: 144px; padding: 36px 36px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .eyebrow { margin-bottom: 7px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin-bottom: 7px; font-size: clamp(25px, 3vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
  h2 { margin-bottom: 0; font-size: 22px; letter-spacing: -.025em; }
  h3 { margin-bottom: 0; font-size: 18px; }
  .page-subtitle, .today { margin-bottom: 0; color: var(--muted); font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .primary-button, .secondary-button, .ghost-button, .danger-button, .icon-button {
    min-height: 44px; border: 0; border-radius: 8px; font-weight: 700; transition: 160ms ease-out;
  }
  .primary-button { padding: 0 20px; color: #fff; background: var(--red); box-shadow: 0 6px 14px rgba(200,22,46,.16); }
  .primary-button:hover { background: var(--red-hover); transform: translateY(-1px); }
  .secondary-button { padding: 0 16px; color: var(--petrol); background: #e9f0f2; }
  .ghost-button { min-height: 36px; padding: 0 10px; color: var(--petrol); background: transparent; }
  .ghost-button:hover { background: #f1f5f6; }
  .danger-button { padding: 0 16px; color: var(--red); background: var(--red-soft); }
  .icon-button { width: 40px; color: var(--muted); background: #eef3f4; font-size: 22px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(200,22,46,.22); outline-offset: 2px; }
  .content { padding: 0 36px 44px; }
  .metric-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .metric-card, .panel, .loading-card, .inventory-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 7px rgba(6,26,36,.05); }
  .metric-card { min-height: 132px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .metric-label { color: var(--muted); font-size: 13px; font-weight: 650; }
  .metric-value { font-size: 30px; line-height: 1; font-weight: 780; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .metric-card.urgent { border-color: #efc8cf; }
  .metric-card.urgent .metric-value { color: var(--red); }
  .dashboard-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 20px; margin-top: 20px; }
  .panel { padding: 26px; }
  .panel-header, .view-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
  .task-list { display: grid; }
  .task-row { min-height: 64px; padding: 10px 4px; border-top: 1px solid var(--line-soft); display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; }
  .task-row:first-child { border-top: 0; }
  .task-row strong { display: block; margin-bottom: 3px; font-size: 14px; }
  .task-row small { color: var(--muted); }
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .quick-action { min-height: 75px; padding: 15px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; text-align: left; font-weight: 650; transition: 160ms ease-out; }
  .quick-action:hover { border-color: #b8c7cc; background: #f8fafb; transform: translateY(-1px); }
  .quick-action small { display: block; margin-top: 5px; color: var(--muted); font-weight: 450; }
  .view-toolbar { margin-bottom: 14px; }
  .search { width: min(420px, 100%); height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 850px; }
  th { padding: 13px 14px; color: var(--muted); background: #f8fafb; border-bottom: 1px solid var(--line); text-align: left; font-size: 11px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
  td { padding: 13px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fafcfc; }
  .row-actions { display: flex; gap: 4px; white-space: nowrap; }
  .amount { font-weight: 750; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 11px; font-weight: 700; }
  .pill.warning { color: var(--red); background: var(--red-soft); }
  .pill.success { color: var(--green); background: var(--green-soft); }
  .pill.neutral { color: #536168; background: #f0f2f3; }
  .empty-state { padding: 48px 20px; color: var(--muted); text-align: center; }
  .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }
  .inventory-card { min-height: 260px; padding: 32px; display: grid; place-items: center; text-align: center; }
  .inventory-card p { max-width: 520px; margin: 10px auto 0; color: var(--muted); }
  .modal-backdrop { position: fixed; inset: 0; z-index: 100; padding: 24px; background: rgba(3,17,22,.62); display: grid; place-items: center; backdrop-filter: blur(5px); }
  .modal { width: min(920px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 14px; background: #fff; box-shadow: 0 28px 80px rgba(0,0,0,.25); }
  .modal-header { padding: 23px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .form-grid { padding: 22px 26px 26px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .field { display: grid; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label { color: #4f5d62; font-size: 12px; font-weight: 750; }
  .field input, .field select, .field textarea { width: 100%; min-height: 43px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .field textarea { min-height: 86px; resize: vertical; }
  .form-actions { grid-column: 1 / -1; padding-top: 8px; display: flex; justify-content: flex-end; gap: 9px; }
  .line-items { grid-column: 1 / -1; display: grid; gap: 9px; }
  .line-item { display: grid; grid-template-columns: 1fr 105px 130px 44px; gap: 8px; align-items: end; padding: 12px; border: 1px solid var(--line-soft); border-radius: 9px; background: #fbfcfc; }
  .line-item.remit { grid-template-columns: 1fr 90px 190px 44px; }
  .line-item.budget { grid-template-columns: 1fr 80px 140px 44px; }
  .section-label { grid-column: 1 / -1; margin: 5px 0 -3px; font-size: 14px; font-weight: 800; }
  .toast { position: fixed; top: 88px; right: 24px; z-index: 120; max-width: 360px; padding: 13px 16px; border-radius: 8px; color: #fff; background: var(--petrol); box-shadow: 0 12px 34px rgba(6,26,36,.20); font-size: 13px; font-weight: 700; }
  .toast.error { background: var(--red-hover); }
  .loading-card { min-height: 270px; display: grid; place-items: center; align-content: center; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid #dce7e9; border-top-color: var(--petrol); border-radius: 50%; animation: spin .8s linear infinite; }
  .loading-card p { margin: 13px 0 0; }
  .hidden { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 1120px) {
    .metric-grid { grid-template-columns: repeat(2, 1fr); }
    .dashboard-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .brandbar { padding: 0 18px; }
    .profile { font-size: 0; }
    .module-nav { padding: 0 8px; }
    .nav-item { padding: 0 14px; }
    .page-header { padding: 26px 17px 20px; align-items: flex-start; flex-direction: column; }
    .header-actions { width: 100%; justify-content: space-between; }
    .content { padding: 0 16px 32px; }
    .metric-grid { grid-template-columns: 1fr; }
    .quick-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; padding: 19px; }
    .field.full, .form-actions, .line-items, .section-label { grid-column: auto; }
    .line-item, .line-item.remit, .line-item.budget { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
  </head>
  <body>
    <header class="brandbar">
      <div class="brand">
        <div class="brand-mark">BF</div>
        <strong>Bio-Fix</strong><span>Gestión</span>
      </div>
      <div class="profile"><span class="profile-icon">●</span> Administración</div>
    </header>
    <nav class="module-nav" aria-label="Módulos">
      <button class="nav-item active" data-view="inicio">Inicio</button>
      <button class="nav-item" data-view="clientes">Clientes</button>
      <button class="nav-item" data-view="pedidos">Pedidos</button>
      <button class="nav-item" data-view="presupuestos">Presupuestos</button>
      <button class="nav-item" data-view="remitos">Remitos</button>
      <button class="nav-item" data-view="ventas">Ventas</button>
      <button class="nav-item" data-view="cobros">Cobros</button>
      <button class="nav-item" data-view="gastos">Gastos</button>
      <button class="nav-item" data-view="productos">Productos pedidos/remitos</button>
      <button class="nav-item" data-view="inventario">Inventario</button>
    </nav>
    <main class="main">
      <header class="page-header">
        <div>
          <p class="eyebrow">Bio-Fix · Administración</p>
          <h1 id="pageTitle">Buen día, Administración</h1>
          <p class="page-subtitle" id="pageSubtitle">Resumen de hoy</p>
        </div>
        <div class="header-actions">
          <span class="today" id="today"></span>
          <button class="primary-button" id="newButton">＋ Nuevo pedido</button>
        </div>
      </header>
      <section id="appContent" class="content">
        <div class="loading-card"><div class="spinner"></div><p>Cargando gestión Bio-Fix…</p></div>
      </section>
    </main>
    <div class="modal-backdrop hidden" id="modalBackdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header">
          <div>
            <p class="eyebrow" id="modalEyebrow">Nuevo registro</p>
            <h2 id="modalTitle">Cargar información</h2>
          </div>
          <button class="icon-button" id="closeModal" aria-label="Cerrar">×</button>
        </header>
        <div id="modalContent"></div>
      </section>
    </div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script>
  var URL_API = 'https://script.google.com/macros/s/AKfycbwIOiCoAKm5FNSXvyJxY92RxqeVaYJO4iIRR_A7h7PHKQYxPnDndXjg5zrmh2YjV73u/exec';
  const state = {
    view: 'inicio',
    bootstrap: null,
    products: [],
    clients: [],
    records: {},
    currentOrder: null
  };
  const views = {
    clientes: { title: 'Clientes', singular: 'cliente', columns: ['Cliente ID', 'Nombre completo', 'CUIL', 'Matrícula profesional', 'Localidad', 'Provincia', 'Estado'] },
    productos: { title: 'Productos para pedidos y remitos', singular: 'producto detallado', columns: ['Producto', 'Categoría', 'Sistema', 'Precio', 'Activo'] },
    pedidos: { title: 'Pedidos', singular: 'pedido', columns: ['Pedido ID', 'Fecha y hora', 'Cliente', 'Vendedor', 'Cantidad total', 'Forma de entrega', 'Estado'] },
    presupuestos: { title: 'Presupuestos', singular: 'presupuesto', columns: ['Número', 'Fecha', 'Pedido ID', 'Cliente', 'Total', 'Saldo pendiente', 'Estado'] },
    remitos: { title: 'Remitos', singular: 'remito', columns: ['Número', 'Fecha', 'Pedido ID', 'Cliente', 'Transporte', 'Seguimiento', 'Estado', 'Revisión'] },
    ventas: { title: 'Ventas', singular: 'venta', columns: ['Venta ID', 'Fecha', 'Cliente', 'Total', 'Cobrado', 'Saldo', 'Vencimiento', 'Estado'] },
    cobros: { title: 'Cobros', singular: 'cobro', columns: ['Cobro ID', 'Fecha', 'Venta ID', 'Cliente', 'Importe', 'Medio de pago', 'Comprobante'] },
    gastos: { title: 'Gastos', singular: 'gasto', columns: ['Gasto ID', 'Fecha', 'Categoría', 'Proveedor', 'Concepto', 'Medio de pago', 'Importe'] }
  };
  document.addEventListener('DOMContentLoaded', function () {
    bindShell();
    init();
  });
  function bindShell() {
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.addEventListener('click', function () { navigate(button.dataset.view); });
    });
    document.getElementById('newButton').addEventListener('click', handleNew);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function (event) {
      if (event.target === event.currentTarget) closeModal();
    });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeModal(); });
  }
  function init() {
    Promise.all([
      server('getAdminBootstrap'),
      server('getActiveProducts'),
      server('listAdmin', 'clientes')
    ]).then(function (results) {
      state.bootstrap = results[0];
      state.products = results[1];
      state.clients = results[2];
      document.getElementById('today').textContent = state.bootstrap.today;
      renderCurrent();
    }).catch(showError);
  }
  function refresh() {
    return Promise.all([
      server('getAdminBootstrap'),
      server('getActiveProducts'),
      server('listAdmin', 'clientes')
    ]).then(function (results) {
      state.bootstrap = results[0];
      state.products = results[1];
      state.clients = results[2];
      renderCurrent();
    });
  }
  function navigate(view) {
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.classList.toggle('active', button.dataset.view === view);
    });
    renderCurrent();
  }
  function renderCurrent() {
    if (!state.bootstrap) return;
    const isHome = state.view === 'inicio';
    const isInventory = state.view === 'inventario';
    const meta = views[state.view];
    document.getElementById('pageTitle').textContent = isHome ? 'Buen día, Administración' : isInventory ? 'Inventario' : meta.title;
    document.getElementById('pageSubtitle').textContent = isHome ? 'Resumen de hoy' : isInventory ? 'Movimientos de stock' : 'Consulta y gestión de ' + meta.title.toLowerCase();
    updateNewButton();
    if (isHome) renderDashboard();
    else if (isInventory) renderInventory();
    else loadView(state.view);
  }
  function updateNewButton() {
    const button = document.getElementById('newButton');
    const labels = {
      clientes: '＋ Nuevo cliente',
      productos: '＋ Nuevo producto',
      pedidos: '＋ Pedido manual',
      remitos: 'Ver pedidos',
      ventas: 'Ver presupuestos',
      cobros: 'Ver ventas',
      gastos: '＋ Registrar gasto',
    };
    // El botón rojo de arriba se saca en: Inicio (el único acceso a "Nuevo
    // pedido" queda en la tile de Accesos rápidos, que redirige a
    // Inventario › Apartado), Inventario (tiene sus propios botones de
    // movimiento) y Presupuestos (ya tiene su propio botón "＋ Generar
    // presupuesto" en la barra de la tabla — no hace falta duplicarlo).
    const oculto = ['inicio', 'inventario', 'presupuestos'].includes(state.view);
    button.classList.toggle('hidden', oculto);
    button.textContent = labels[state.view] || '＋ Nuevo';
  }
  function handleNew() {
    if (state.view === 'clientes') return openClientForm();
    if (state.view === 'productos') return openProductForm();
    if (state.view === 'gastos') return openExpenseForm();
    if (state.view === 'presupuestos') return openBudgetFromApartadoPicker();
    if (state.view === 'remitos') return navigate('pedidos');
    if (state.view === 'ventas') return navigate('presupuestos');
    if (state.view === 'cobros') return navigate('ventas');
    return openManualOrderForm();
  }
  function renderDashboard() {
    const s = state.bootstrap.stats;
    const tasks = state.bootstrap.recent || [];
    document.getElementById('appContent').innerHTML = `
      <section class="metric-grid">
        ${metric('Pedidos recibidos', s.pedidosNuevos, s.pedidosNuevos > 0)}
        ${metric('Presupuestos abiertos', s.presupuestosPendientes)}
        ${metric('Remitos por emitir', s.remitosPendientes)}
        ${metric('Pendientes de pago', s.ventasPendientes, s.ventasPendientes > 0)}
        ${metric('Saldo a cobrar', money(s.saldoPendiente), s.saldoPendiente > 0)}
      </section>
      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-header"><h3>Pedidos para revisar</h3><button class="ghost-button" data-go="pedidos">Ver todos</button></div>
          <div class="task-list">
            ${tasks.length ? tasks.map(function (r) {
              return `<button class="task-row ghost-row" data-order="${attr(r['Pedido ID'])}">
                <span><strong>${html(r['Cliente'])}</strong><small>${html(r['Pedido ID'])} · ${html(r['Fecha y hora'])}</small></span>
                <span class="pill ${pillClass(r['Estado'])}">${html(r['Estado'])}</span>
                <span>›</span>
              </button>`;
            }).join('') : empty('No hay pedidos pendientes.')}
          </div>
        </article>
        <article class="panel">
          <div class="panel-header"><h3>Accesos rápidos</h3></div>
          <div class="quick-grid">
            ${quick('cliente', 'Nuevo cliente', 'Registrar datos')}
            ${quick('pedido', 'Nuevo pedido', 'Implantes: vía apartado en Inventario')}
            ${quick('presupuesto', 'Crear presupuesto', 'Desde un pedido apartado')}
            ${quick('remito', 'Emitir remito', 'Completar lotes')}
            ${quick('cobro', 'Registrar cobro', 'Aplicar a una venta')}
            ${quick('gasto', 'Registrar gasto', 'Guardar un egreso')}
          </div>
        </article>
      </section>`;
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => navigate(b.dataset.go));
    document.querySelectorAll('[data-order]').forEach(b => b.onclick = () => openOrderById(b.dataset.order));
    document.querySelectorAll('[data-quick]').forEach(function (b) {
      b.onclick = function () {
        const action = b.dataset.quick;
        if (action === 'cliente') openClientForm();
        if (action === 'pedido') { navigate('inventario'); invSetMov('apartado'); }
        if (action === 'presupuesto') openBudgetFromApartadoPicker();
        if (action === 'remito') navigate('pedidos');
        if (action === 'cobro') navigate('ventas');
        if (action === 'gasto') openExpenseForm();
      };
    });
  }
const STOCK_TIPOS = [
  { id: 'MP', nombre: 'Monopieza (MP)' },
  { id: 'HI', nombre: 'Hexágono Interno Montado - sin tetón (HI)' },
  { id: 'HISM', nombre: 'Hexágono Interno Sin Montar - con tetón (HISM)' },
  { id: 'HE', nombre: 'Hexágono Externo (HE)' },
  { id: 'CM', nombre: 'Cono Morse (CM)' },
  { id: 'CMU', nombre: 'Compresivo Multiunit (CMU)' },
  { id: 'CMU3', nombre: 'Compresivo Multiunit C3 (CMU3)' },
  { id: 'MBT', nombre: 'Monopieza Basal Tratado (MBT)' },
  { id: 'MBP', nombre: 'Monopieza Basal Pulido (MBP)' }
];
const inv = { mov: 'deposito', stock: {}, stockCargado: false, carrito: [], stockMax: 0 };
function renderInventory() {
  document.getElementById('appContent').innerHTML = `
    <article class="panel">
      <div class="panel-header"><h3>Movimiento de stock</h3></div>
      <div class="form-grid">
        <div class="field full">
          <label>Tipo de movimiento</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="secondary-button inv-mov" data-mov="deposito">Depósito</button>
            <button type="button" class="secondary-button inv-mov" data-mov="salida">Salida (venta)</button>
            <button type="button" class="secondary-button inv-mov" data-mov="apartado">Apartado</button>
          </div>
        </div>

// Llamada JSONP directa al doGet del archivo de Stock (acciones que NO
// están registradas en FUNCIONES_PANEL, así que no se puede usar server()).
function jsonp(params, cb) {
  var cbName = 'jscbInv_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  var script = document.createElement('script');
  window[cbName] = function (data) {
    delete window[cbName];
    document.body.removeChild(script);
    cb(null, data);
  };
  script.onerror = function () {
    delete window[cbName];
    document.body.removeChild(script);
    cb(new Error('No se pudo conectar con el servidor.'), null);
  };
  var qs = '?callback=' + cbName;
  Object.keys(params).forEach(function (k) {
    qs += '&' + k + '=' + encodeURIComponent(params[k]);
  });
  script.src = URL_API + qs;
  document.body.appendChild(script);
}

function invOnTipo() {
  const tipo = document.getElementById('invTipo').value;
  const selMed = document.getElementById('invMedida');
  selMed.innerHTML = '<option value="">— Seleccioná medida —</option>';
  document.getElementById('invLote').innerHTML = '<option value="">—</option>';
  document.getElementById('invLoteTexto').value = '';
  document.getElementById('invStockHint').textContent = '';
  if (!tipo || !inv.stock[tipo]) return;
  const medidas = [...new Set(inv.stock[tipo].map(i => i.medida))];
  medidas.forEach(m => selMed.insertAdjacentHTML('beforeend', `<option value="${attr(m)}">${html(m)}</option>`));
}
function invStockDisponible(tipo, medida, lote) {
  const item = (inv.stock[tipo] || []).find(i => i.medida === medida && i.lote === lote);
  const stockOriginal = item ? item.stock : 0;
  const yaEnCarrito = inv.carrito
    .filter(it => it.tipo_imp === tipo && it.medida === medida && it.lote_sel === lote)
    .reduce((a, it) => a + it.cantidad, 0);
  return stockOriginal - yaEnCarrito;
}
// Solo se usa en Salida/Apartado (Depósito usa el campo de texto libre, no este select)
function invOnMedida() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const selLote = document.getElementById('invLote');
  selLote.innerHTML = '<option value="">— Seleccioná lote —</option>';
  (inv.stock[tipo] || []).filter(i => i.medida === medida).forEach(i => {
    const disp = invStockDisponible(tipo, medida, i.lote);
    if (disp <= 0) return;
    selLote.insertAdjacentHTML('beforeend', `<option value="${attr(i.lote)}">${html(i.lote)} (Disp: ${disp})</option>`);
  });
}
function invOnLote() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const lote = document.getElementById('invLote').value;
  if (!lote) { inv.stockMax = 0; document.getElementById('invStockHint').textContent = ''; return; }
  inv.stockMax = invStockDisponible(tipo, medida, lote);

function invAgregarItem() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const lote = document.getElementById('invLote').value;
  const cant = Number(document.getElementById('invCantidad').value) || 0;
  if (!tipo || !medida || !lote) return showError(new Error('Elegí tipo, medida y lote.'));
  if (cant <= 0 || cant > inv.stockMax) return showError(new Error('Cantidad inválida o mayor al stock disponible (' + inv.stockMax + ').'));
  inv.carrito.push({ tipo_imp: tipo, medida: medida, lote_sel: lote, cantidad: cant });

  invOnMedida();

  function updateApartadoBudgetTotal() {
    const totalEl = document.getElementById('apartadoBudgetTotal');
    if (!totalEl) return;
    const qtys = Array.from(document.querySelectorAll('.apartado-item-qty')).map(i => Number(i.value) || 0);
    const prices = Array.from(document.querySelectorAll('.apartado-item-price')).map(i => Number(i.value) || 0);
    const subtotal = qtys.reduce((sum, qty, idx) => sum + qty * (prices[idx] || 0), 0);
    const discountType = document.querySelector('#apartadoBudgetBody select[name="discountType"]');
    const discountValue = document.querySelector('#apartadoBudgetBody input[name="discountValue"]');
    const dType = discountType ? discountType.value : 'Porcentaje';
    const dValue = discountValue ? Number(discountValue.value) || 0 : 0;
    const discountAmount = dType === 'Importe' ? Math.min(dValue, subtotal) : subtotal * Math.min(dValue, 100) / 100;
    totalEl.textContent = money(Math.max(0, subtotal - discountAmount));
  }

  // Emitir remito: parte de un Pedido ya presupuestado, autocompleta
  // cliente/fecha/producto/cantidad/lote desde el pedido (no hace falta
  // tocar nada ahí), deja "Forma de entrega" y "Aclaración" para completar
  // a mano, y al confirmar: genera el remito con número correlativo único,
  // arma el PDF con la plantilla Bio-Fix (RemitoPDF.gs) y lo guarda solo en
  // la carpeta de Drive "Remitos Bio-Fix" — además lo abre en una pestaña
  // nueva para poder imprimirlo al toque.
  function openEmitirRemitoForm(order) {
    const items = (order.items || []).map(function (i) {
      return { productId: i['Producto ID'], codigo: i['Código'], producto: i['Producto'], quantity: toNumber(i['Cantidad']), lot: i['Lote'] || '' };
    });
    openModal('Emitir remito · Pedido ' + order['Pedido ID'], `<form class="form-grid" id="emitirRemitoForm">
      <div class="field"><label>Cliente</label><strong>${html(order['Cliente'])}</strong></div>

      ${selectField('delivery', ['Envío a domicilio', 'Retiro por sucursal Via Cargo', 'Retiro en fábrica'], '', true, false, 'Tipo de entrega')}

      <p class="section-label">Productos · autocompletado desde el pedido</p>
      <div class="table-wrap field full"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Lote</th></tr></thead><tbody>
        ${items.map(i => `<tr><td>${html(i.producto)}</td><td>${html(i.quantity)}</td><td>${html(i.lot || '—')}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="field full"><p style="color:var(--muted);font-size:12px">El número de remito se genera solo, arriba del documento, y no se repite. Al confirmar se guarda el PDF en Drive (carpeta "Remitos Bio-Fix") y se abre para imprimir.</p></div>
      ${actions('Emitir remito')}
    </form>`);
    document.getElementById('emitirRemitoForm').onsubmit = function (event) {
      event.preventDefault();
      const raw = formObject(event.target);
      if (!raw.delivery) return showError(new Error('Elegí el tipo de entrega.'));
      const submitButton = event.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Emitiendo…';
      server('createRemitFromOrder', { orderId: order['Pedido ID'], date: todayIso(), transport: '', tracking: '', notes: raw.notes, items: items })
        .then(function (created) {
          // createRemitFromOrder trae "Forma de entrega" del Pedido; acá la
          // pisamos con lo que se completó a mano al emitir el remito.
          return server('updateRemit', {
            remitId: created.id, date: todayIso(), delivery: raw.delivery, address: '',
            transport: '', tracking: '', notes: raw.notes, items: items
          }).then(function () { return created; });
        })
        .then(function (created) {
          return server('generarRemitoPDF', created.id).then(function (pdf) { return { created: created, pdf: pdf }; });
        })
        .then(function (result) {
          closeModal();
          showToast('Remito N° ' + result.created.number + ' emitido y guardado en Drive.');
          if (result.pdf && result.pdf.url) window.open(result.pdf.url, '_blank');
          refresh();
        })
        .catch(function (err) {
          submitButton.disabled = false;
          submitButton.textContent = 'Emitir remito';
          showError(err);
        });
    };
  }

          ${selectField('budgetId', clientBudgets.map(b => ({

            label: 'Presupuesto ' + (b['Número'] || b['Presupuesto ID']) + ' · ' + money(b['Total'])
          })), '', true, true, 'Presupuesto aceptado')}
          <div class="field full"><p>Esta acción marcará el remito como <strong>Entregado</strong>, el pedido como <strong>Vendido</strong> y la venta asociada como <strong>Cobrada</strong>.</p></div>
          ${clientBudgets.length ? actions('Confirmar vendido') : '<div class="field full"><p class="helper">Este cliente todavía no tiene un presupuesto con importe.</p></div>'}
        </form>`;
      if (!clientBudgets.length) return;
      document.getElementById('soldRemitForm').onsubmit = function (event) {
        event.preventDefault();
        const budgetId = formObject(event.target).budgetId;
        const button = event.target.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Confirmando…';
        server('markRemitAsSold', remitId, budgetId)
          .then(function () { closeModal(); showToast('Remito entregado y venta cobrada.'); refresh(); })
          .catch(showError);
      };
    }).catch(showError);
  }
  function openSaleForm(budgetId) {
    openModal('Crear venta', `<form class="form-grid" id="saleForm">
      ${field('date', todayIso(), true, false, 'date', 'Fecha')}
      ${field('dueDate', '', false, false, 'date', 'Vencimiento')}
      ${selectField('paymentTerms', ['Contado', 'Transferencia', 'Cuenta corriente', 'A convenir'], 'A convenir', false, false, 'Condición de pago')}
      ${textareaField('notes', '', false, 'Observaciones')}
      ${actions('Crear venta')}
    </form>`);
    document.getElementById('saleForm').onsubmit = function (event) {
      event.preventDefault();
      const raw = formObject(event.target);
      submit('createSaleFromBudget', Object.assign({ budgetId: budgetId }, raw), 'Venta creada.');
    };
  }
  function openPaymentForm(sale) {
    openModal('Registrar cobro · ' + sale['Venta ID'], `<form class="form-grid" id="paymentForm">
      <div class="field full"><label>Cliente</label><strong>${html(sale['Cliente'])}</strong><span>Saldo pendiente: ${money(sale['Saldo'])}</span></div>
      ${field('date', todayIso(), true, false, 'date', 'Fecha')}
      ${field('amount', sale['Saldo'], true, false, 'number', 'Importe')}
      ${selectField('paymentMethod', ['Transferencia', 'Efectivo', 'Tarjeta', 'Cheque', 'Otro'], '', true, false, 'Medio de pago')}
      ${field('receipt', '', false, false, 'text', 'Comprobante')}
      ${textareaField('notes', '', false, 'Observaciones')}
      ${actions('Registrar cobro')}
    </form>`);
    document.getElementById('paymentForm').onsubmit = function (event) {
      event.preventDefault();
      submit('savePayment', Object.assign({ saleId: sale['Venta ID'] }, formObject(event.target)), 'Cobro registrado.');
    };
  }
  function addLine(containerId, type, source) {
    source = source || {};
    const container = document.getElementById(containerId);
    const row = document.createElement('div');
    row.className = 'line-item ' + type;
    const sourceId = source['Producto ID'] || source.productId || '';
    const sourceCode = source['Código'] || source.codigo || '';
    const sourceName = source['Producto'] || source.producto || '';
    const catalog = state.products;
    const matchedProduct = catalog.find(function (p) {
      return (sourceId && p.id === sourceId)
        || (sourceCode && normalize(p.codigo) === normalize(sourceCode))
        || (sourceName && normalize(p.producto) === normalize(sourceName));
    });
    const productId = matchedProduct ? matchedProduct.id : '';
    const quantity = source['Cantidad'] || source.quantity || 1;
    const manualSelected = !matchedProduct && !!sourceName;
    const options = catalog.map(p => `<option value="${attr(p.id)}" ${p.id === productId ? 'selected' : ''}>${html(p.producto)}</option>`).join('');
    row.innerHTML = `
      <div class="field"><label>Producto</label><select class="line-product" required><option value="">Seleccionar…</option><option value="__manual__" ${manualSelected ? 'selected' : ''}>Escribir producto o descripción</option>${options}</select></div>
      <div class="field line-custom-field ${manualSelected ? '' : 'hidden'}"><label>Descripción del producto</label><input class="line-custom-product" type="text" value="${attr(sourceName)}" placeholder="Ej.: Implante dental Bio-Fix"></div>
      <div class="field"><label>Cantidad</label><input class="line-quantity" type="number" min="1" step="1" value="${attr(quantity)}" required></div>
      ${type === 'budget' ? `<div class="field"><label>Precio unitario (ARS)</label><input class="line-price" type="number" min="0" step="0.01" value="${attr(budgetLinePrice(source, matchedProduct))}"></div>` : ''}
      ${type === 'remit' ? `<div class="field"><label>Lote</label><input class="line-lot" type="text" value="${attr(source['Lote'] ?? source.lot ?? '')}" placeholder="Carga manual"></div>` : ''}
      <button type="button" class="icon-button line-remove" aria-label="Quitar">×</button>`;
    container.appendChild(row);
    const select = row.querySelector('.line-product');
    const toggleCustomProduct = function () {
      const isManual = select.value === '__manual__';
      row.querySelector('.line-custom-field').classList.toggle('hidden', !isManual);
      row.querySelector('.line-custom-product').required = isManual;
    };
    select.addEventListener('change', toggleCustomProduct);
    toggleCustomProduct();
    if (type === 'budget') {
      const setPrice = function () {
        const p = state.products.find(x => x.id === select.value);
        if (p) row.querySelector('.line-price').value = p.precio;
      };
      select.addEventListener('change', setPrice);
      if (source['Precio unitario'] === undefined && source.price === undefined) setPrice();
    }
    row.querySelector('.line-remove').onclick = () => row.remove();
  }
  function collectLines(containerId, type) {
    return Array.from(document.querySelectorAll('#' + containerId + ' .line-item')).map(function (row) {
      const selectedValue = row.querySelector('.line-product').value;
      const catalog = state.products;
      const product = catalog.find(p => p.id === selectedValue) || {};
      const manualName = row.querySelector('.line-custom-product').value.trim();
      return {
        productId: product.id || '',
        codigo: product.codigo || '',
        producto: selectedValue === '__manual__' ? manualName : product.producto || '',
        quantity: row.querySelector('.line-quantity').value,
        price: type === 'budget' ? row.querySelector('.line-price').value : undefined,
        lot: type === 'remit' ? row.querySelector('.line-lot').value : undefined
      };
    });
  }
  function submit(method, payload, successMessage) {
    const submitButton = document.querySelector('#modalContent button[type="submit"]');
    if (submitButton) { submitButton.disabled = true; submitButton.textContent = 'Guardando…'; }
    server(method, payload).then(function (result) {
      closeModal();
      showToast(successMessage || 'Registro guardado.');
      return refresh();
    }).catch(showError);
  }
  function done() { closeModal(); showToast('Estado actualizado.'); refresh(); }
  function printDocument(type, id) {
    const popup = window.open('', '_blank', 'width=980,height=760');
    if (!popup) return showError(new Error('El navegador bloqueó la ventana de impresión.'));
    popup.document.write('<p style="font-family:Arial;padding:30px">Preparando documento…</p>');
    server('getDocumentData', type, id).then(function (data) {
      popup.document.open();
      popup.document.write(documentTemplate(data));
      popup.document.close();
      if (type === 'presupuesto') {
        setTimeout(function () { popup.focus(); popup.print(); }, 450);
      }
    }).catch(function (error) { popup.close(); showError(error); });
  }
  function documentTemplate(data) {
    const h = data.header, c = data.client, s = data.settings;
    const isBudget = data.type === 'presupuesto';
    const pendingBalance = isBudget ? toNumber(h['Saldo pendiente']) : 0;
    const subtotalAfterDiscount = isBudget
      ? Math.max(0, toNumber(h['Subtotal']) - toNumber(h['Descuento importe']))
      : 0;
    const title = isBudget ? 'PRESUPUESTO' : 'REMITO';
    const number = h['Número'] || h[isBudget ? 'Presupuesto ID' : 'Remito ID'];
    const rows = data.items.map(function (i) {
      return `<tr><td>${html(i['Producto'])}</td><td>${html(i['Cantidad'])}</td>${isBudget ? `<td>${money(i['Precio unitario'])}</td><td>${money(i['Total'])}</td>` : `<td>${html(i['Lote'] || '')}</td>`}</tr>`;
    }).join('');
    return `<!doctype html><html><head><meta charset="UTF-8"><title>${title} ${html(number)}</title><style>
      body{font-family:Arial,sans-serif;color:#24313a;margin:0;padding:40px}header{display:flex;justify-content:space-between;border-bottom:2px solid #245d6b;padding-bottom:18px}
      h1{color:#245d6b;margin:0;font-size:25px}.company{text-align:right;font-size:13px}.info{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:25px 0}
      .label{color:#317c91;font-size:12px}.box{padding:15px;border:1px solid #dbe7ea}.box p{margin:6px 0}table{width:100%;border-collapse:collapse}th{background:#245d6b;color:white;padding:9px;text-align:left;font-size:12px}td{padding:9px;border:1px solid #9bb6bf;font-size:12px}
      .totals{width:330px;margin:24px 0 0 auto}.totals p{display:flex;justify-content:space-between;margin:0;padding:8px;border:1px solid #9bb6bf;border-top:0}.totals p:first-child{border-top:1px solid #9bb6bf}.grand{font-weight:bold;font-size:16px;background:#edf4f6}
      .notes{margin-top:26px;min-height:75px}.print{position:fixed;right:20px;top:20px}@media print{.print{display:none}body{padding:16px}}</style></head><body>
      <button class="print" onclick="window.print()">${isBudget ? 'Guardar presupuesto en PDF' : 'Imprimir remito'}</button>
      <header><div><span class="label">${html(s.Empresa || 'Bio-Fix')}</span><h1>${title} N.º ${html(number)}</h1></div><div class="company"><strong>${html(s['Razón social'] || 'Grado Cuatro S.R.L.')}</strong><br>${html(s['Dirección'] || '')}<br>${html(s['Localidad'] || '')}</div></header>
      <section class="info"><div class="box"><span class="label">Información del cliente</span><p><strong>${html(h['Cliente'])}</strong></p><p>CUIL: ${html(c['CUIL'] || '')}</p><p>${html(c['Localidad'] || '')} · ${html(c['Provincia'] || '')}</p></div>
      <div class="box"><span class="label">${isBudget ? 'Enviar a' : 'Entrega'}</span><p><strong>${html(h['Dirección de entrega'] || c['Dirección'] || '')}</strong></p><p>${html(c['Localidad'] || '')} ${html(c['Código postal'] || '')}</p><p>${html(c['Provincia'] || '')}</p></div>
      <div class="box"><span class="label">Fecha</span><p><strong>${html(h['Fecha'])}</strong></p>${isBudget ? `<p>Válido hasta: ${html(h['Válido hasta'])}</p>` : `<p>Pedido: ${html(h['Pedido ID'] || '')}</p>`}</div>
      <div class="box"><span class="label">${isBudget ? 'Condiciones' : 'Transporte / seguimiento'}</span><p>${isBudget ? html(h['Condiciones'] || 'A convenir') : html(h['Transporte'] || '')}</p>${isBudget ? '' : `<p>${html(h['Seguimiento'] || '')}</p>`}</div></section>
      <table><thead><tr><th>Descripción</th><th>Cantidad</th>${isBudget ? '<th>Precio unitario</th><th>Total</th>' : '<th>Lote</th>'}</tr></thead><tbody>${rows}</tbody></table>
      ${isBudget ? `<div class="totals"><p><span>Subtotal</span><strong>${money(h['Subtotal'])}</strong></p><p><span>Descuento</span><strong>${money(h['Descuento importe'])}</strong></p><p><span>Subtotal menos descuento</span><strong>${money(subtotalAfterDiscount)}</strong></p>${pendingBalance > 0 ? `<p><span>Saldo pendiente</span><strong>${money(pendingBalance)}</strong></p>` : ''}<p class="grand"><span>Total</span><strong>${money(h['Total'])}</strong></p></div><p style="text-align:right;color:#5f7076;font-size:11px">Importes expresados en pesos argentinos (ARS).</p>` : ''}
      <div class="box notes"><span class="label">Observaciones / notas</span><p>${html(h['Observaciones'] || '')}</p></div>
      </body></html>`;
  }
  function openModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalContent').innerHTML = body;
    document.getElementById('modalBackdrop').classList.remove('hidden');
  }
  function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); document.getElementById('modalContent').innerHTML = ''; }
  function field(name, value, required, full, type, label) {
    return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><input name="${attr(name)}" type="${type || 'text'}" value="${attr(value || '')}" ${required ? 'required' : ''} ${type === 'number' ? 'min="0" step="0.01"' : ''}></div>`;
  }
  function hidden(name, value) { return `<input type="hidden" name="${attr(name)}" value="${attr(value || '')}">`; }
  function textareaField(name, value, full, label) { return `<div class="field ${full === false ? '' : 'full'}"><label>${html(label || name)}</label><textarea name="${attr(name)}">${html(value || '')}</textarea></div>`; }
  function selectField(name, options, selected, required, full, label) {
    const normalized = options.map(o => typeof o === 'string' ? {value:o,label:o} : o);
    return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><select name="${attr(name)}" ${required ? 'required' : ''}><option value="">Seleccionar…</option>${normalized.map(o => `<option value="${attr(o.value)}" ${String(o.value) === String(selected) ? 'selected' : ''}>${html(o.label)}</option>`).join('')}</select></div>`;
  }
  function actions(label) { return `<div class="form-actions"><button type="button" class="secondary-button" onclick="closeModal()">Cancelar</button><button type="submit" class="primary-button">${html(label || 'Guardar')}</button></div>`; }
  function formObject(form) { return Object.fromEntries(new FormData(form).entries()); }
  function metric(label, value, urgent) { return `<article class="metric-card ${urgent ? 'urgent' : ''}"><span class="metric-label">${html(label)}</span><strong class="metric-value">${html(value)}</strong></article>`; }
  function quick(action, title, subtitle) { return `<button class="quick-action" data-quick="${action}">${html(title)}<small>${html(subtitle)}</small></button>`; }
  function empty(message) { return `<div class="empty-state"><strong>${html(message)}</strong><span>El sistema se actualizará cuando haya movimientos.</span></div>`; }
  function loading() { return '<div class="loading-card"><div class="spinner"></div><p>Cargando información…</p></div>'; }
  function findRecord(moduleKey, fieldName, id) { return (state.records[moduleKey] || state.clients || []).find(r => String(r[fieldName]) === String(id)); }
  function cell(column, value) {
    if (column === 'Saldo pendiente' && toNumber(value) <= 0) return '<span class="muted">—</span>';
    if (/Precio|Importe|Subtotal|Total|Saldo|Cobrado/.test(column)) return `<span class="amount">${money(value)}</span>`;
    if (column === 'Estado' || column === 'Revisión' || column === 'Activo') return `<span class="pill ${pillClass(value)}">${html(value || '-')}</span>`;
    const text = String(value || '-');
    return html(text.length > 95 ? text.slice(0, 95) + '…' : text);
  }
  function pillClass(value) {
    const v = normalize(value);
    if (['recibido','en revision','borrador','enviado','preparado','despachado','pendiente de pago'].includes(v) || v.includes('revisar')) return 'warning';
    if (['aprobado','remitido','entregado','vendido','cobrada','activo','si'].includes(v)) return 'success';
    return 'neutral';
  }
  function money(value) { return new Intl.NumberFormat('es-AR', {style:'currency',currency:'ARS',maximumFractionDigits:2}).format(toNumber(value)); }
  function budgetLinePrice(source, matchedProduct) {
    const hasSavedPrice = source['Precio unitario'] !== undefined || source.price !== undefined;
    const savedPrice = toNumber(source['Precio unitario'] !== undefined ? source['Precio unitario'] : source.price);
    const catalogPrice = toNumber(matchedProduct && matchedProduct.precio);
    if (hasSavedPrice && savedPrice > 0 && savedPrice < 1000 && catalogPrice >= 1000) return catalogPrice;
    if (hasSavedPrice) return savedPrice;
    return catalogPrice || '';
  }
  function toNumber(value) {
    if (typeof value === 'number') return value;
    let t = String(value || '').replace(/\$/g,'').replace(/\s/g,'');
    if (!t) return 0;
    const hasComma = t.includes(',');
    const hasDot = t.includes('.');
    if (hasComma && hasDot) {
      t = t.lastIndexOf(',') > t.lastIndexOf('.')
        ? t.replace(/\./g,'').replace(',','.')
        : t.replace(/,/g,'');
    } else if (hasComma) {
      t = /^-?\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g,'') : t.replace(',','.');
    } else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(t)) {
      t = t.replace(/\./g,'');
    }
    return Number(t) || 0;
  }
  function normalize(value) { return String(value || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function todayIso() { return new Date().toISOString().slice(0,10); }
  function inputDate(value) {
    const text = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
    const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return match ? `${match[3]}-${match[2].padStart(2,'0')}-${match[1].padStart(2,'0')}` : todayIso();
  }
  function addDays(iso, days) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); }
  function provinces() { return ['Buenos Aires','Ciudad Autónoma de Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego, Antártida e Islas del Atlántico Sur','Tucumán']; }
  function html(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
  function attr(value) { return html(value); }
  function showToast(message, error) {
    const toast = document.getElementById('toast');
    toast.textContent = message; toast.classList.toggle('error', !!error); toast.classList.remove('hidden');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3500);
  }
  function showError(error) { showToast(error && error.message ? error.message : 'Ocurrió un error.', true); console.error(error); }
  function server(name, ...args) {
  return new Promise(function (resolve, reject) {
    var cbName = 'jscbPanel_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var script = document.createElement('script');
    window[cbName] = function (data) {
      delete window[cbName];
      document.body.removeChild(script);
      if (data && data.ok) {
        resolve('data' in data ? data.data : data);
      } else {
        reject(new Error(data && data.error ? data.error : 'Error de servidor.'));
      }
    };
    script.onerror = function () {
      delete window[cbName];
      document.body.removeChild(script);
      reject(new Error('No se pudo conectar con el servidor.'));
    };
    var qs = '?callback=' + cbName
      + '&accion=' + encodeURIComponent(name)
      + '&args=' + encodeURIComponent(JSON.stringify(args));
    script.src = URL_API + qs;
    document.body.appendChild(script);
  });
}
</script>
  </body>
