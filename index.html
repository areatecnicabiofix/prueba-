function confirmEmitirRemito(remitId) {
  openModal('Emitir remito', `
    <div class="form-grid">
      <div class="field full"><p>Se va a marcar el remito <strong>${html(remitId)}</strong> como vendido, cerrar el apartado si corresponde y generar el PDF. Después de emitido no se pueden editar los productos ni los lotes.</p></div>
      <div class="form-actions">
        <button type="button" class="secondary-button" onclick="closeModal()">Cancelar</button>
        <button type="button" class="ghost-button" id="revisarAntesBtn">Revisar remito primero</button>
        <button type="button" class="primary-button" id="confirmarEmitirBtn">Emitir remito</button>
      </div>
    </div>`);
  document.getElementById('revisarAntesBtn').onclick = function () {
    closeModal();
    openEditRemit(findRecord('remitos', 'Remito ID', remitId));
  };
  document.getElementById('confirmarEmitirBtn').onclick = function () {
    const btn = document.getElementById('confirmarEmitirBtn');
    btn.disabled = true; btn.textContent = 'Emitiendo…';
    // emitirRemito ya genera el PDF del lado del servidor (ver
    // BackendPanel.gs) — un viaje menos al servidor que antes.
    server('emitirRemito', remitId)
      .then(function (result) {
        closeModal();
        showToast('Remito ' + remitId + ' emitido y marcado como vendido.');
        if (result && result.pdf && result.pdf.url) window.open(result.pdf.url, '_blank');
        refresh();
      })
      .catch(function (err) { btn.disabled = false; btn.textContent = 'Emitir remito'; showError(err); });
  };
}

// Editar un remito: mientras está en Borrador se pueden tocar productos,
// cantidades y lotes (editar el remito ES editar el apartado), además de
// entrega/observaciones/número de presupuesto manual, y hay un botón
// "Emitir remito" que guarda los cambios y, en el mismo paso, confirma la
// venta y genera el PDF. Ya Entregado, los productos/lotes quedan fijos.
function openEditRemit(remit) {
  if (!remit) return showError(new Error('Remito no encontrado.'));
  const esBorrador = remit['Estado'] === 'Borrador';
  const viaCargoActual = parseViaCargoNumero_(remit['Numero de Remito Via Cargo']);
  openModal('Editar remito ' + remit['Remito ID'], `<form class="form-grid" id="editRemitForm">
    ${field('date', inputDate(remit['Fecha']), true, false, 'date', 'Fecha')}
    ${selectField('delivery', ['Retiro por sucursal Via Cargo', 'Retiro en Fábrica'], remit['Forma de entrega'], false, false, 'Forma de entrega')}
    ${field('address', remit['Dirección de entrega'], false, true, 'text', 'Dirección de entrega')}
    ${viaCargoCamposHtml_(viaCargoActual.prefijo, viaCargoActual.resto)}
    ${field('tracking', remit['Seguimiento'], false, false, 'text', 'Número de seguimiento')}
    ${fieldConPrefijo('numeroPresupuesto', 'PRE-', quitarPrefijoPresupuesto_(remit['Numero de Presupuesto']), 'Número de presupuesto (opcional, manual — tu talonario en papel)')}
    ${selectField('origen', ['Formulario', 'Histórico'], remit['Origen'] || 'Formulario', false, false, 'Origen')}
    ${textareaField('notes', remit['Observaciones'], false, 'Observaciones')}
    <p class="section-label">Productos y lotes${esBorrador ? ' — editar el remito es editar el apartado' : ' — ya se emitió, quedan fijos'}</p>
    <div class="line-items" id="editRemitItems"></div>
    ${esBorrador ? '<button type="button" class="secondary-button" id="addEditRemitItem">＋ Agregar producto</button>' : ''}
    <div class="form-actions">
      <button type="button" class="secondary-button" onclick="closeModal()">Cancelar</button>
      ${esBorrador ? '<button type="button" class="primary-button" id="emitirRemitoBtn">Emitir remito</button>' : ''}
      <button type="submit" class="secondary-button">Guardar remito</button>
    </div>
  </form>`);
  wireViaCargoCampos_();
  (remit.items || []).forEach(i => addLine('editRemitItems', 'remit', i));
  if (!esBorrador) {
    deshabilitarLineas_('editRemitItems');
  } else {
    document.getElementById('addEditRemitItem').onclick = () => addLine('editRemitItems', 'remit');
  }
  wireDeliveryAddressAutoFill_('editRemitForm', 'delivery', 'address');

  function payloadDesdeForm() {
    const raw = formObject(document.getElementById('editRemitForm'));
    const payload = {
      remitId: remit['Remito ID'], date: raw.date, delivery: raw.delivery, address: raw.address,
      viaCargoRemito: leerViaCargoNumero_(), tracking: raw.tracking, numeroPresupuesto: raw.numeroPresupuesto,
      origen: raw.origen, notes: raw.notes
    };
    if (esBorrador) payload.items = collectLines('editRemitItems', 'remit');
    return payload;
  }

  document.getElementById('editRemitForm').onsubmit = function (event) {
    event.preventDefault();
    submit('updateRemit', payloadDesdeForm(), 'Remito actualizado.');
  };

  if (esBorrador) {
    document.getElementById('emitirRemitoBtn').onclick = function () {
      const btn = document.getElementById('emitirRemitoBtn');
      btn.disabled = true; btn.textContent = 'Emitiendo…';
      // emitirRemito ya genera el PDF del lado del servidor — un viaje
      // menos al servidor que antes (updateRemit + emitirRemito, en vez
      // de updateRemit + emitirRemito + generarRemitoPDF).
      server('updateRemit', payloadDesdeForm())
        .then(() => server('emitirRemito', remit['Remito ID']))
        .then(function (result) {
          closeModal();
          showToast('Remito ' + remit['Remito ID'] + ' emitido y marcado como vendido.');
          if (result && result.pdf && result.pdf.url) window.open(result.pdf.url, '_blank');
          refresh();
        })
        .catch(function (err) { btn.disabled = false; btn.textContent = 'Emitir remito'; showError(err); });
    };
  }
}

// Sugiere la Dirección de entrega según la Forma de entrega elegida
// (Via Cargo -> sucursal, Fábrica -> San Pedro 4929).
const DELIVERY_ADDRESS_SUGGESTIONS = {
  'Retiro por sucursal Via Cargo': 'Sucursal Via Cargo',
  'Retiro en Fábrica': 'San Pedro 4929'
};
function suggestedAddressForDelivery_(delivery) { return DELIVERY_ADDRESS_SUGGESTIONS[delivery] || ''; }
function wireDeliveryAddressAutoFill_(formId, deliveryName, addressName) {
  const form = document.getElementById(formId);
  if (!form) return;
  const select = form.querySelector('[name="' + deliveryName + '"]');
  const address = form.querySelector('[name="' + addressName + '"]');
  if (!select || !address) return;
  select.addEventListener('change', function () {
    const suggestion = suggestedAddressForDelivery_(select.value);
    if (suggestion) address.value = suggestion;
  });
}

function addLine(containerId, type, source, lotesApartadoMap) {
  source = source || {};
  const container = document.getElementById(containerId);
  const row = document.createElement('div');
  row.className = 'line-item ' + type;
  const sourceId = source['Producto ID'] || source.productId || '';
  const sourceCode = source['Código'] || source.codigo || '';
  const sourceName = source['Producto'] || source.producto || '';
  const catalog = state.products;
  const matchedProduct = catalog.find(function (p) {
    return (sourceId && p.id === sourceId) || (sourceCode && normalize(p.codigo) === normalize(sourceCode)) || (sourceName && normalize(p.producto) === normalize(sourceName));
  });
  const productId = matchedProduct ? matchedProduct.id : '';
  const quantity = source['Cantidad'] || source.quantity || 1;
  const manualSelected = !matchedProduct && !!sourceName;
  const options = catalog.map(p => `<option value="${attr(p.id)}" ${p.id === productId ? 'selected' : ''}>${html(p.producto)}</option>`).join('');
  // El campo "Producto" es UNA sola columna: o muestra la lista (select) o
  // muestra el texto libre (input), nunca los dos a la vez.
  row.innerHTML = `
    <div class="field line-product-field">
      <label>Producto</label>
      <select class="line-product" ${manualSelected ? 'hidden' : ''} required><option value="">Seleccionar…</option><option value="__manual__" ${manualSelected ? 'selected' : ''}>Escribir producto o descripción</option>${options}</select>
      <input class="line-custom-product ${manualSelected ? '' : 'hidden'}" type="text" value="${attr(sourceName)}" placeholder="Escribir producto o descripción">
      <button type="button" class="line-toggle-mode ${manualSelected ? '' : 'hidden'}" style="background:none;border:none;padding:2px 0;margin-top:2px;font-size:11px;color:var(--petrol);text-decoration:underline;cursor:pointer">← Elegir de la lista</button>
    </div>
    <div class="field"><label>Cantidad</label><input class="line-quantity" type="number" min="1" step="1" value="${attr(quantity)}" required></div>
    ${type === 'remit' ? `<div class="field"><label>Lote</label><input class="line-lot" type="text" value="${attr(source['Lote'] ?? source.lot ?? '')}" placeholder="Carga manual"></div>` : ''}
    <button type="button" class="icon-button line-remove" aria-label="Quitar">×</button>`;
  container.appendChild(row);

  const select = row.querySelector('.line-product');
  const customInput = row.querySelector('.line-custom-product');
  const backButton = row.querySelector('.line-toggle-mode');
  const showManual = function () {
    select.hidden = true; select.required = false;
    customInput.classList.remove('hidden'); customInput.required = true;
    backButton.classList.remove('hidden'); customInput.focus();
  };
  const showList = function () {
    select.hidden = false; select.required = true; select.value = '';
    customInput.classList.add('hidden'); customInput.required = false; customInput.value = '';
    backButton.classList.add('hidden');
  };
  select.addEventListener('change', function () { if (select.value === '__manual__') showManual(); });
  backButton.addEventListener('click', showList);
  if (manualSelected) showManual();

  row.querySelector('.line-remove').onclick = () => row.remove();
}

function collectLines(containerId, type) {
  return Array.from(document.querySelectorAll('#' + containerId + ' .line-item')).map(function (row) {
    const selectedValue = row.querySelector('.line-product').value;
    const catalog = state.products;
    const product = catalog.find(p => p.id === selectedValue) || {};
    const manualName = row.querySelector('.line-custom-product').value.trim();
    const loteInput = row.querySelector('.line-lot');
    return {
      productId: product.id || '',
      codigo: product.codigo || '',
      producto: selectedValue === '__manual__' ? manualName : product.producto || '',
      quantity: row.querySelector('.line-quantity').value,
      lot: (type === 'remit') ? (loteInput ? loteInput.value.trim() : '') : undefined
    };
  });
}

function submit(method, payload, successMessage) {
  const submitButton = document.querySelector('#modalContent button[type="submit"]');
  if (submitButton) { submitButton.disabled = true; submitButton.textContent = 'Guardando…'; }
  server(method, payload).then(function (result) {
    closeModal();
    showToast(successMessage || 'Registro guardado.');
    return refresh();
  }).catch(showError);
}

function done() {
  closeModal();
  showToast('Estado actualizado.');
  refresh();
}

function printDocument(type, id) {
  const popup = window.open('', '_blank', 'width=980,height=760');
  if (!popup) return showError(new Error('El navegador bloqueó la ventana de impresión.'));
  popup.document.write('<p style="font-family:Arial;padding:30px">Preparando documento…</p>');
  server('getDocumentData', type, id).then(function (data) {
    popup.document.open();
    popup.document.write(remitoTemplateHtml_(data));
    popup.document.close();
    // Garantiza que el remito quede guardado en Drive cada vez que se
    // imprime, aunque la generación original haya fallado (por ejemplo,
    // por un timeout al emitirlo).
    server('generarRemitoPDF', id).catch(function () {});
  }).catch(function (error) {
    popup.close();
    showError(error);
  });
}

// Solo los números del Cliente ID (ej: "CLI-006" -> "006"), igual criterio
// que soloNumeros_ en RemitoPDF.gs — así "Información del Cliente" se ve
// igual en el remito impreso y en el PDF guardado.
function soloNumerosCliente_(clienteId) {
  const digitos = String(clienteId || '').replace(/\D+/g, '');
  return digitos || String(clienteId || '');
}

// Plantilla del remito para imprimir desde el navegador — es el MISMO
// diseño que arma generarRemitoPDF (RemitoPDF.gs) para el PDF que queda
// guardado en Drive.
function remitoTemplateHtml_(data) {
  const h = data.header, c = data.client, s = data.settings || {};
  const items = data.items || [];
  const totalCantidad = items.reduce(function (sum, it) { return sum + toNumber(it['Cantidad']); }, 0);
  const filasItems = items.map(function (it) {
    return `<tr><td>${html(it['Producto'])}</td><td class="centro">${toNumber(it['Cantidad'])}</td><td class="centro">${html(it['Lote'] || '')}</td></tr>`;
  }).join('');
  return `<!doctype html><html><head><meta charset="UTF-8"><title>Remito ${html(h['Remito ID'])}</title><style>
    body{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;margin:0;padding:24px}
    table{border-collapse:collapse;width:100%;}
    .encabezado{width:100%;margin-bottom:10px;}
    .info td{border:1px solid #000;padding:4px 6px;}
    .marca{font-size:22px;font-weight:bold;text-align:right;vertical-align:top;padding-left:14px;}
    .marca small{display:block;font-weight:normal;font-size:9px;}
    .seccion{background:#08242c;color:#fff;text-align:center;padding:4px;font-weight:bold;}
    .items th{background:#9fc5e8;color:#000;font-weight:bold;padding:4px 6px;border:1px solid #000;}
    .items td{border:1px solid #000;padding:4px 6px;}
    .centro{text-align:center;}
    .total td{font-weight:bold;border:1px solid #000;padding:4px 6px;}
    .print{position:fixed;right:20px;top:20px}
    @media print{.print{display:none}body{padding:8px}}
  </style></head><body>
  <button class="print" onclick="window.print()">Imprimir remito</button>
  <table class="encabezado"><tr>
    <td style="width:60%;vertical-align:top">
      <table class="info">
        <tr><td colspan="2">Información del Cliente ${html(soloNumerosCliente_(c['Cliente ID']))}</td></tr>
        <tr><td colspan="2"><strong>NOMBRE:</strong> ${html(c['Nombre completo'] || '')}</td></tr>
        <tr><td colspan="2"><strong>FECHA:</strong> ${html(h['Fecha'])}</td></tr>
        <tr><td colspan="2"><strong>TIPO DE ENTREGA:</strong> ${html(h['Forma de entrega'] || '')}</td></tr>
        <tr><td colspan="2"><strong>ACLARACIÓN:</strong> ${html(h['Observaciones'] || '')}</td></tr>
      </table>
    </td>
    <td style="width:40%" class="marca">${s['Logo URL'] ? `<img src="${attr(s['Logo URL'])}" style="max-height:44px;max-width:200px">` : 'BIO-FIX'}<small>SISTEMA DE IMPLANTES DENTALES</small></td>
  </tr></table>
  <div class="seccion">Detalles</div>
  <table class="items">
    <tr><th>IMPLANTES ENTREGADOS</th><th>CANTIDAD</th><th>LOTE</th></tr>
    ${filasItems}
    <tr class="total"><td>TOTAL DE PRODUCTOS</td><td class="centro">${totalCantidad}</td><td></td></tr>
  </table>
  </body></html>`;
}

function openModal(title, body) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = body;
  document.getElementById('modalBackdrop').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.add('hidden');
  document.getElementById('modalContent').innerHTML = '';
}

function field(name, value, required, full, type, label) {
  return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><input name="${attr(name)}" type="${type || 'text'}" value="${attr(value || '')}" ${required ? 'required' : ''} ${type === 'number' ? 'min="0" step="0.01"' : ''}></div>`;
}

// Campo con un prefijo fijo no editable + un input para el resto (usado
// para "Número de presupuesto": el prefijo "PRE-" es fijo, el usuario solo
// tipea el número — ver normalizarNumeroPresupuesto_ en BackendPanel.gs,
// que arma el valor final "PRE-<número>" al guardar).
function fieldConPrefijo(name, prefijo, value, label) {
  return `<div class="field"><label>${html(label || name)}</label>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="pill neutral" style="flex:0 0 auto">${html(prefijo)}</span>
      <input name="${attr(name)}" type="text" value="${attr(value || '')}" style="flex:1 1 auto" placeholder="número">
    </div></div>`;
}

// Para mostrar en el input solo el número, sin el prefijo "PRE-" ya
// guardado (si el remito es viejo y no lo tenía, se muestra tal cual).
function quitarPrefijoPresupuesto_(valor) {
  return String(valor || '').replace(/^PRE-/i, '');
}

function hidden(name, value) {
  return `<input type="hidden" name="${attr(name)}" value="${attr(value || '')}">`;
}

function textareaField(name, value, full, label) {
  return `<div class="field ${full === false ? '' : 'full'}"><label>${html(label || name)}</label><textarea name="${attr(name)}">${html(value || '')}</textarea></div>`;
}

function selectField(name, options, selected, required, full, label) {
  const normalized = options.map(o => typeof o === 'string' ? { value: o, label: o } : o);
  return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><select name="${attr(name)}" ${required ? 'required' : ''}><option value="">Seleccionar…</option>${normalized.map(o => `<option value="${attr(o.value)}" ${String(o.value) === String(selected) ? 'selected' : ''}>${html(o.label)}</option>`).join('')}</select></div>`;
}

function actions(label) {
  return `<div class="form-actions"><button type="button" class="secondary-button" onclick="closeModal()">Cancelar</button><button type="submit" class="primary-button">${html(label || 'Guardar')}</button></div>`;
}

function formObject(form) { return Object.fromEntries(new FormData(form).entries()); }

function metric(label, value, urgent) {
  return `<article class="metric-card ${urgent ? 'urgent' : ''}"><span class="metric-label">${html(label)}</span><strong class="metric-value">${html(value)}</strong></article>`;
}

function quick(action, title, subtitle) {
  return `<button class="quick-action" data-quick="${action}">${html(title)}<small>${html(subtitle)}</small></button>`;
}

function empty(message) {
  return `<div class="empty-state"><strong>${html(message)}</strong><span>El sistema se actualizará cuando haya movimientos.</span></div>`;
}

function loading() { return '<div class="loading-card"><div class="spinner"></div><p>Cargando información…</p></div>'; }

function findRecord(moduleKey, fieldName, id) {
  return (state.records[moduleKey] || state.clients || []).find(r => String(r[fieldName]) === String(id));
}

function pillClass(value) {
  const v = normalize(value);
  if (['recibido', 'en revision', 'borrador', 'apartado', 'pendiente', 'pendiente de pago'].includes(v) || v.includes('revisar')) return 'warning';
  if (['aprobado', 'remitido', 'entregado', 'vendido', 'saldado', 'activo', 'si'].includes(v)) return 'success';
  return 'neutral';
}

function money(value) {
  return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 2 }).format(toNumber(value));
}

function toNumber(value) {
  if (typeof value === 'number') return value;
  let t = String(value || '').replace(/\$/g, '').replace(/\s/g, '');
  if (!t) return 0;
  const hasComma = t.includes(',');
  const hasDot = t.includes('.');
  if (hasComma && hasDot) {
    t = t.lastIndexOf(',') > t.lastIndexOf('.') ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  } else if (hasComma) {
    t = /^-?\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g, '') : t.replace(',', '.');
  } else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(t)) {
    t = t.replace(/\./g, '');
  }
  return Number(t) || 0;
}

function normalize(value) {
  return String(value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function todayIso() { return new Date().toISOString().slice(0, 10); }

function inputDate(value) {
  const text = String(value || '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
  const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return match ? `${match[3]}-${match[2].padStart(2, '0')}-${match[1].padStart(2, '0')}` : todayIso();
}

function addDays(iso, days) {
  const d = new Date(iso + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function provinces() {
  return ['Buenos Aires', 'Ciudad Autónoma de Buenos Aires', 'Catamarca', 'Chaco', 'Chubut', 'Córdoba', 'Corrientes', 'Entre Ríos', 'Formosa', 'Jujuy', 'La Pampa', 'La Rioja', 'Mendoza', 'Misiones', 'Neuquén', 'Río Negro', 'Salta', 'San Juan', 'San Luis', 'Santa Cruz', 'Santa Fe', 'Santiago del Estero', 'Tierra del Fuego, Antártida e Islas del Atlántico Sur', 'Tucumán'];
}

function html(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
}

function attr(value) { return html(value); }

function showToast(message, error) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.toggle('error', !!error);
  toast.classList.remove('hidden');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3500);
}

function showError(error) {
  showToast(error && error.message ? error.message : 'Ocurrió un error.', true);
  console.error(error);
}

function server(name, ...args) {
  return new Promise(function (resolve, reject) {
    var cbName = 'jscbPanel_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var script = document.createElement('script');
    var done = false;
    var timeoutId = setTimeout(function () {
      if (done) return;
      done = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('El servidor no respondió a tiempo (' + name + '). Verificá que el Web App de Apps Script esté desplegado con la última versión del código.'));
    }, 55000);
    window[cbName] = function (data) {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (data && data.ok) {
        resolve('data' in data ? data.data : data);
      } else {
        reject(new Error(data && data.error ? data.error : 'Error de servidor.'));
      }
    };
    script.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('No se pudo conectar con el servidor.'));
    };
    var qs = '?callback=' + cbName + '&accion=' + encodeURIComponent(name) + '&args=' + encodeURIComponent(JSON.stringify(args));
    script.src = URL_API + qs;
    document.body.appendChild(script);
  });
}
</script>
