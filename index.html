<!DOCTYPE html>
<!-- BIOFIX_PANEL_V14_SIN_PRESUPUESTO -->
<html lang="es">
<head>
<base target="_top">
<meta charset="UTF-8">
<style>
:root {
  --petrol: #061a24;
  --petrol-hover: #0b2632;
  --red: #c8162e;
  --red-hover: #a91227;
  --ink: #1b2a30;
  --muted: #6d7c82;
  --line: #dce4e7;
  --line-soft: #e8eef0;
  --bg: #f4f7f8;
  --surface: #fff;
  --blue-soft: #eaf3ff;
  --blue: #2366b1;
  --red-soft: #fce9ec;
  --green-soft: #e9f6ef;
  --green: #247a56;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { color: var(--ink); background: var(--bg); font-family: Inter, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin-top: 0; }
.brandbar { height: 72px; padding: 0 36px; color: #fff; background: var(--petrol); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(3,21,29,.18); }
.brand { display: flex; align-items: center; gap: 7px; font-size: 19px; }
.brand strong { font-weight: 750; }
.brand span { font-weight: 400; }
.brand-mark { width: 36px; height: 36px; margin-right: 7px; border: 1px solid #fff; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 850; }
.profile { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
.profile-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--petrol); font-size: 13px; }
.module-nav { height: 56px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: thin; }
.nav-item { flex: 0 0 auto; min-width: max-content; padding: 0 19px; border: 0; border-bottom: 4px solid transparent; color: #31434a; background: transparent; font-size: 14px; font-weight: 550; transition: 160ms ease-out; }
.nav-item:hover { background: #f7f9fa; }
.nav-item.active { color: var(--ink); border-bottom-color: var(--red); font-weight: 700; }
.main { width: min(100%, 1440px); margin: 0 auto; }
.page-header { min-height: 144px; padding: 36px 36px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.eyebrow { margin-bottom: 7px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
h1 { margin-bottom: 7px; font-size: clamp(25px, 3vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
h2 { margin-bottom: 0; font-size: 22px; letter-spacing: -.025em; }
h3 { margin-bottom: 0; font-size: 18px; }
.page-subtitle, .today { margin-bottom: 0; color: var(--muted); font-size: 14px; }
.header-actions { display: flex; align-items: center; gap: 16px; }
.primary-button, .secondary-button, .ghost-button, .danger-button, .icon-button { min-height: 44px; border: 0; border-radius: 8px; font-weight: 700; transition: 160ms ease-out; }
.primary-button { padding: 0 20px; color: #fff; background: var(--red); box-shadow: 0 6px 14px rgba(200,22,46,.16); }
.primary-button:hover { background: var(--red-hover); transform: translateY(-1px); }
.secondary-button { padding: 0 16px; color: var(--petrol); background: #e9f0f2; }
.ghost-button { min-height: 36px; padding: 0 10px; color: var(--petrol); background: transparent; }
.ghost-button:hover { background: #f1f5f6; }
.danger-button { padding: 0 16px; color: var(--red); background: var(--red-soft); }
.icon-button { width: 40px; color: var(--muted); background: #eef3f4; font-size: 22px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(200,22,46,.22); outline-offset: 2px; }
.content { padding: 0 36px 44px; }
.metric-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.metric-card, .panel, .loading-card, .inventory-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 7px rgba(6,26,36,.05); }
.metric-card { min-height: 132px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.metric-label { color: var(--muted); font-size: 13px; font-weight: 650; }
.metric-value { font-size: 30px; line-height: 1; font-weight: 780; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.metric-card.urgent { border-color: #efc8cf; }
.metric-card.urgent .metric-value { color: var(--red); }
.dashboard-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 20px; margin-top: 20px; }
.panel { padding: 26px; }
.panel-header, .view-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
.task-list { display: grid; }
.task-row { min-height: 64px; padding: 10px 4px; border-top: 1px solid var(--line-soft); display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; }
.task-row:first-child { border-top: 0; }
.task-row strong { display: block; margin-bottom: 3px; font-size: 14px; }
.task-row small { color: var(--muted); }
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.quick-action { min-height: 75px; padding: 15px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; text-align: left; font-weight: 650; transition: 160ms ease-out; }
.quick-action:hover { border-color: #b8c7cc; background: #f8fafb; transform: translateY(-1px); }
.quick-action small { display: block; margin-top: 5px; color: var(--muted); font-weight: 450; }
.view-toolbar { margin-bottom: 14px; }
.search { width: min(420px, 100%); height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
table { width: 100%; border-collapse: collapse; min-width: 850px; }
th { padding: 13px 14px; color: var(--muted); background: #f8fafb; border-bottom: 1px solid var(--line); text-align: left; font-size: 11px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
td { padding: 13px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: #fafcfc; }
.row-actions { display: flex; gap: 4px; white-space: nowrap; }
.amount { font-weight: 750; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 11px; font-weight: 700; }
.pill.warning { color: var(--red); background: var(--red-soft); }
.pill.success { color: var(--green); background: var(--green-soft); }
.pill.neutral { color: #536168; background: #f0f2f3; }
.empty-state { padding: 48px 20px; color: var(--muted); text-align: center; }
.empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }
.inventory-card { min-height: 260px; padding: 32px; display: grid; place-items: center; text-align: center; }
.inventory-card p { max-width: 520px; margin: 10px auto 0; color: var(--muted); }
.modal-backdrop { position: fixed; inset: 0; z-index: 100; padding: 24px; background: rgba(3,17,22,.62); display: grid; place-items: center; backdrop-filter: blur(5px); }
.modal { width: min(1040px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 14px; background: #fff; box-shadow: 0 28px 80px rgba(0,0,0,.25); }
.modal-header { padding: 23px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.form-grid { padding: 22px 26px 26px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
.field { display: grid; gap: 7px; }
.field.full { grid-column: 1 / -1; }
.field label { color: #4f5d62; font-size: 12px; font-weight: 750; }
.field input, .field select, .field textarea { width: 100%; min-height: 43px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
.field textarea { min-height: 86px; resize: vertical; }
.form-actions { grid-column: 1 / -1; padding-top: 8px; display: flex; justify-content: flex-end; gap: 9px; }
.line-items { grid-column: 1 / -1; display: grid; gap: 9px; }
.line-item { display: grid; grid-template-columns: 1fr 105px 130px 44px; gap: 8px; align-items: end; padding: 12px; border: 1px solid var(--line-soft); border-radius: 9px; background: #fbfcfc; }
.line-item.remit { grid-template-columns: 1fr 90px 190px 44px; }
.section-label { grid-column: 1 / -1; margin: 5px 0 -3px; font-size: 14px; font-weight: 800; }
.toast { position: fixed; top: 88px; right: 24px; z-index: 120; max-width: 360px; padding: 13px 16px; border-radius: 8px; color: #fff; background: var(--petrol); box-shadow: 0 12px 34px rgba(6,26,36,.20); font-size: 13px; font-weight: 700; }
.toast.error { background: var(--red-hover); }
.loading-card { min-height: 270px; display: grid; place-items: center; align-content: center; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid #dce7e9; border-top-color: var(--petrol); border-radius: 50%; animation: spin .8s linear infinite; }
.loading-card p { margin: 13px 0 0; }
.hidden { display: none !important; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (max-width: 1120px) {
  .metric-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .brandbar { padding: 0 18px; }
  .profile { font-size: 0; }
  .module-nav { padding: 0 8px; }
  .nav-item { padding: 0 14px; }
  .page-header { padding: 26px 17px 20px; align-items: flex-start; flex-direction: column; }
  .header-actions { width: 100%; justify-content: space-between; }
  .content { padding: 0 16px 32px; }
  .metric-grid { grid-template-columns: 1fr; }
  .quick-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; padding: 19px; }
  .field.full, .form-actions, .line-items, .section-label { grid-column: auto; }
  .line-item, .line-item.remit { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<header class="brandbar">
  <div class="brand">
    <div class="brand-mark">BF</div>
    <strong>Bio-Fix</strong><span>Gestión</span>
  </div>
  <div class="profile"><span class="profile-icon">●</span> Administración</div>
</header>

<nav class="module-nav" aria-label="Módulos">
  <button class="nav-item active" data-view="inicio">Inicio</button>
  <button class="nav-item" data-view="clientes">Clientes</button>
  <button class="nav-item" data-view="pedidos">Pedidos</button>
  <button class="nav-item" data-view="remitos">Remitos</button>
  <button class="nav-item" data-view="productos">Productos pedidos/remitos</button>
  <button class="nav-item" data-view="inventario">Inventario</button>
</nav>

<main class="main">
  <header class="page-header">
    <div>
      <p class="eyebrow">Bio-Fix · Administración</p>
      <h1 id="pageTitle">Buen día, Administración</h1>
      <p class="page-subtitle" id="pageSubtitle">Resumen de hoy</p>
    </div>
    <div class="header-actions">
      <span class="today" id="today"></span>
      <button class="primary-button" id="newButton">＋ Nuevo pedido</button>
    </div>
  </header>

  <section id="appContent" class="content">
    <div class="loading-card"><div class="spinner"></div><p>Cargando gestión Bio-Fix…</p></div>
  </section>
</main>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header class="modal-header">
      <div>
        <p class="eyebrow" id="modalEyebrow">Nuevo registro</p>
        <h2 id="modalTitle">Cargar información</h2>
      </div>
      <button class="icon-button" id="closeModal" aria-label="Cerrar">×</button>
    </header>
    <div id="modalContent"></div>
  </section>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
var URL_API = 'https://script.google.com/macros/s/AKfycbyuigXuVH5gllL6vuQAD7hfKdBdJX609G_SUm3nswRt-C_X4AWHkEq8cHQeN4uEjgwH/exec';

const state = { view: 'inicio', bootstrap: null, products: [], clients: [], records: {}, currentOrder: null };

const views = {
  clientes: { title: 'Clientes', singular: 'cliente', columns: ['Cliente ID', 'Nombre completo', 'CUIL', 'Matrícula profesional', 'Localidad', 'Provincia', 'Estado'] },
  productos: { title: 'Productos para pedidos y remitos', singular: 'producto detallado', columns: ['Producto', 'Categoría', 'Sistema', 'Activo'] },
  pedidos: { title: 'Pedidos', singular: 'pedido', columns: ['Pedido ID', 'Fecha y hora', 'Cliente', 'Vendedor', 'Cantidad total', 'Forma de entrega', 'Estado'] },
  remitos: { title: 'Remitos', singular: 'remito', columns: ['Remito ID', 'Fecha', 'Pedido ID', 'Cliente', 'Numero de Remito Via Cargo', 'Seguimiento', 'Estado', 'Origen', 'Revisión'] },
};

document.addEventListener('DOMContentLoaded', function () {
  bindShell();
  init();
});

function bindShell() {
  document.querySelectorAll('.nav-item').forEach(function (button) {
    button.addEventListener('click', function () { navigate(button.dataset.view); });
  });
  document.getElementById('newButton').addEventListener('click', handleNew);
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', function (event) {
    if (event.target === event.currentTarget) closeModal();
  });
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeModal(); });
}

function init() {
  Promise.all([
    server('getAdminBootstrap'),
    server('getActiveProducts'),
    server('listAdmin', 'clientes')
  ]).then(function (results) {
    state.bootstrap = results[0];
    state.products = results[1];
    state.clients = results[2];
    document.getElementById('today').textContent = state.bootstrap.today;
    renderCurrent();
  }).catch(showError);
}

function refresh() {
  return Promise.all([
    server('getAdminBootstrap'),
    server('getActiveProducts'),
    server('listAdmin', 'clientes')
  ]).then(function (results) {
    state.bootstrap = results[0];
    state.products = results[1];
    state.clients = results[2];
    renderCurrent();
  });
}

function navigate(view) {
  state.view = view;
  document.querySelectorAll('.nav-item').forEach(function (button) {
    button.classList.toggle('active', button.dataset.view === view);
  });
  renderCurrent();
}

function renderCurrent() {
  if (!state.bootstrap) return;
  const isHome = state.view === 'inicio';
  const isInventory = state.view === 'inventario';
  const meta = views[state.view];
  document.getElementById('pageTitle').textContent = isHome ? 'Buen día, Administración' : isInventory ? 'Inventario' : meta.title;
  document.getElementById('pageSubtitle').textContent = isHome ? 'Resumen de hoy' : isInventory ? 'Movimientos de stock' : 'Consulta y gestión de ' + meta.title.toLowerCase();
  updateNewButton();
  if (isHome) renderDashboard();
  else if (isInventory) renderInventory();
  else loadView(state.view);
}

function updateNewButton() {
  const button = document.getElementById('newButton');
  const labels = {
    clientes: '＋ Nuevo cliente',
    productos: '＋ Nuevo producto',
  };
  // El botón rojo de arriba solo hace falta en Clientes y Productos: en
  // Inicio el único acceso a "Nuevo pedido" queda en la tile de Accesos
  // rápidos (redirige a Inventario › Apartado); Inventario, Pedidos y
  // Remitos tienen sus propios botones/flujos (Apartado genera el remito
  // solo, y desde un Pedido se genera con "Generar remito").
  const oculto = ['inicio', 'inventario', 'pedidos', 'remitos'].includes(state.view);
  button.classList.toggle('hidden', oculto);
  button.textContent = labels[state.view] || '＋ Nuevo';
}

function handleNew() {
  if (state.view === 'clientes') return openClientForm();
  if (state.view === 'productos') return openProductForm();
}

function renderDashboard() {
  const s = state.bootstrap.stats;
  const tasks = state.bootstrap.recent || [];
  document.getElementById('appContent').innerHTML = `
    <section class="metric-grid">
      ${metric('Pedidos recibidos', s.pedidosNuevos, s.pedidosNuevos > 0)}
      ${metric('Remitos en borrador', s.remitosBorrador)}
    </section>
    <section class="dashboard-grid">
      <article class="panel">
        <div class="panel-header"><h3>Pedidos para revisar</h3><button class="ghost-button" data-go="pedidos">Ver todos</button></div>
        <div class="task-list">
          ${tasks.length ? tasks.map(function (r) {
            return `<button class="task-row ghost-row" data-order="${attr(r['Pedido ID'])}">
              <span><strong>${html(r['Cliente'])}</strong><small>${html(r['Pedido ID'])} · ${html(r['Fecha y hora'])}</small></span>
              <span class="pill ${pillClass(r['Estado'])}">${html(r['Estado'])}</span>
              <span>›</span>
            </button>`;
          }).join('') : empty('No hay pedidos pendientes.')}
        </div>
      </article>
      <article class="panel">
        <div class="panel-header"><h3>Accesos rápidos</h3></div>
        <div class="quick-grid">
          ${quick('cliente', 'Nuevo cliente', 'Registrar datos')}
          ${quick('pedido', 'Nuevo pedido', 'Implantes: vía apartado en Inventario')}
          ${quick('remitos', 'Remitos en borrador', 'Revisar, editar y emitir')}
          ${quick('remitoManual', 'Emitir remito manual', 'Para un pedido sin apartado')}
        </div>
      </article>
    </section>`;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => navigate(b.dataset.go));
  document.querySelectorAll('[data-order]').forEach(b => b.onclick = () => openOrderById(b.dataset.order));
  document.querySelectorAll('[data-quick]').forEach(function (b) {
    b.onclick = function () {
      const action = b.dataset.quick;
      if (action === 'cliente') openClientForm();
      if (action === 'pedido') { navigate('inventario'); invSetMov('apartado'); }
      if (action === 'remitos') navigate('remitos');
      if (action === 'remitoManual') navigate('pedidos');
    };
  });
}

const STOCK_TIPOS = [
  { id: 'MP', nombre: 'Monopieza (MP)' },
  { id: 'HI', nombre: 'Hexágono Interno Montado - sin tetón (HI)' },
  { id: 'HISM', nombre: 'Hexágono Interno Sin Montar - con tetón (HISM)' },
  { id: 'HE', nombre: 'Hexágono Externo (HE)' },
  { id: 'CM', nombre: 'Cono Morse (CM)' },
  { id: 'CMU', nombre: 'Compresivo Multiunit (CMU)' },
  { id: 'CMU3', nombre: 'Compresivo Multiunit C3 (CMU3)' },
  { id: 'MBT', nombre: 'Monopieza Basal Tratado (MBT)' },
  { id: 'MBP', nombre: 'Monopieza Basal Pulido (MBP)' }
];

const inv = { mov: 'deposito', stock: {}, medidas: {}, stockCargado: false, carrito: [], stockMax: 0 };

function renderInventory() {
  document.getElementById('appContent').innerHTML = `
    <article class="panel">
      <div class="panel-header"><h3>Movimiento de stock</h3></div>
      <div class="form-grid">
        <div class="field full">
          <label>Tipo de movimiento</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="secondary-button inv-mov" data-mov="deposito">Depósito</button>
            <button type="button" class="secondary-button inv-mov" data-mov="salida">Salida (venta)</button>
            <button type="button" class="secondary-button inv-mov" data-mov="apartado">Apartado</button>
          </div>
        </div>
        <div class="field full hidden" id="invApartadosPendientesWrap">
          <p class="section-label" id="invApartadosPendientesLabel">Apartados pendientes</p>
          <div id="invApartadosPendientesBox"></div>
        </div>
        <div id="invManualEntryWrap" style="display:contents">
          <div class="field"><label>Tipo de implante</label>
            <select id="invTipo"><option value="">— Seleccioná —</option>${STOCK_TIPOS.map(t => `<option value="${t.id}">${html(t.nombre)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Medida</label><select id="invMedida"><option value="">— Elegí tipo primero —</option></select></div>
          <div class="field hidden" id="invLoteSelectWrap">
            <label>Lote</label><select id="invLote"><option value="">—</option></select><small id="invStockHint"></small>
          </div>
          <div class="field hidden" id="invLoteTextoWrap">
            <label>Lote</label><input type="text" id="invLoteTexto" placeholder="Ej: Lot-MP-0185">
            <small>Un mismo lote se puede repetir en varias medidas: escribilo una vez, agregá cada medida con su cantidad y quedan todas bajo ese lote. Si ya existe, se suma la cantidad; si no existe, se crea nuevo.</small>
          </div>
          <div class="field"><label>Cantidad</label><input type="number" id="invCantidad" min="1"></div>
          <button type="button" class="secondary-button hidden" id="invAddItem">＋ Agregar</button>
        </div>
        <div class="field full hidden" id="invCartWrap">
          <p class="section-label" id="invCartLabel">Ítems</p>
          <div id="invCartList"></div>
        </div>
        <div class="field full hidden" id="invClienteWrap">
          <p class="section-label">Cliente</p>
          <div class="field full">
            <div id="invApartadoBox" class="field full hidden" style="padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfc"></div>
            <label>Buscar cliente</label>
            <input type="text" id="invClienteBuscar" placeholder="Escribí nombre, CUIL o localidad…" autocomplete="off">
            <input type="hidden" id="invClienteId" value="">
            <div id="invClienteResultados" class="table-wrap hidden" style="max-height:230px;overflow:auto;margin-top:6px"></div>
          </div>
          <div class="form-grid" style="padding:0;margin-top:8px" id="invClienteNuevoFields">
            <div class="field"><label>Nombre</label><input id="invNombre"></div>
            <div class="field"><label>Apellido</label><input id="invApellido"></div>
            <div class="field"><label>CUIL</label><input id="invCuil"></div>
            <div class="field"><label>Localidad</label><input id="invLocalidad"></div>
          </div>
        </div>
        <div class="form-actions" id="invSubmitWrap">
          <button type="button" class="primary-button" id="invSubmit">Registrar movimiento</button>
        </div>
      </div>
    </article>`;
  invSetMov('deposito');
  if (!inv.stockCargado) invCargarStock();
  document.querySelectorAll('.inv-mov').forEach(b => b.onclick = () => invSetMov(b.dataset.mov));
  document.getElementById('invTipo').onchange = invOnTipo;
  document.getElementById('invMedida').onchange = invOnMedida;
  document.getElementById('invLote').onchange = invOnLote;
  document.getElementById('invAddItem').onclick = invAgregarItem;
  document.getElementById('invSubmit').onclick = invSubmit;
  document.getElementById('invClienteBuscar').oninput = invClienteBuscarInput;
  document.addEventListener('click', invClienteClickAfuera);
}

// Reinicia TODO el formulario al cambiar de modo, para que nada se traslade entre pestañas
function invSetMov(mov) {
  inv.mov = mov;
  inv.carrito = [];
  inv.stockMax = 0;
  document.querySelectorAll('.inv-mov').forEach(function (b) {
    const activo = b.dataset.mov === mov;
    b.classList.toggle('primary-button', activo);
    b.classList.toggle('secondary-button', !activo);
  });
  document.getElementById('invTipo').value = '';
  document.getElementById('invMedida').innerHTML = '<option value="">— Elegí tipo primero —</option>';
  document.getElementById('invLote').innerHTML = '<option value="">—</option>';
  document.getElementById('invLoteTexto').value = '';
  document.getElementById('invCantidad').value = '';
  document.getElementById('invStockHint').textContent = '';
  document.getElementById('invLoteSelectWrap').classList.toggle('hidden', mov === 'deposito');
  document.getElementById('invLoteTextoWrap').classList.toggle('hidden', mov !== 'deposito');
  const usaCarrito = (mov === 'salida' || mov === 'apartado' || mov === 'deposito');
  document.getElementById('invAddItem').classList.toggle('hidden', !usaCarrito);
  document.getElementById('invCartWrap').classList.toggle('hidden', !usaCarrito);
  document.getElementById('invClienteWrap').classList.toggle('hidden', !(mov === 'salida' || mov === 'apartado'));
  document.getElementById('invCartLabel').textContent = mov === 'apartado' ? 'Ítems del apartado' : (mov === 'deposito' ? 'Medidas a cargar' : 'Ítems de la venta');
  document.getElementById('invClienteBuscar').value = '';
  document.getElementById('invClienteId').value = '';
  document.getElementById('invClienteResultados').classList.add('hidden');
  invClienteLimpiarCampos();
  inv.apartadoActivo = null;
  inv.usandoApartado = false;
  inv.pedidoConRemito = null;
  document.getElementById('invApartadoBox').classList.add('hidden');
  invToggleManualVentaUI_(true); // vuelve a mostrar la carga manual al cambiar de pestaña
  const labels = {
    deposito: 'Registrar movimiento',
    salida: 'Generar remito en borrador',
    apartado: 'Registrar apartado y generar remito'
  };
  document.getElementById('invSubmit').textContent = labels[mov];
  invRenderCarrito();
  // Lista de apartados pendientes: en Salida sirve para elegir directo el
  // cliente que ya tiene algo apartado (sin tener que buscarlo a mano), y
  // en Apartado sirve para reabrir/editar/emitir el remito de uno ya cargado.
  const mostrarPendientes = (mov === 'salida' || mov === 'apartado');
  document.getElementById('invApartadosPendientesWrap').classList.toggle('hidden', !mostrarPendientes);
  document.getElementById('invApartadosPendientesLabel').textContent = mov === 'apartado'
    ? 'Apartados pendientes — tocá uno para editar o emitir su remito'
    : 'Apartados pendientes — tocá uno para cargarlo a la venta';
  if (mostrarPendientes) invRenderApartadosPendientes();
}

// En Salida (venta), cuando el cliente elegido ya tiene un remito, la única
// forma de vender es revisarlo/emitirlo desde ahí — se oculta la carga
// manual (tipo/medida/lote/cantidad + su botón de "＋ Agregar") para que no
// queden dos opciones juntas. Se vuelve a mostrar todo apenas se cambia de
// cliente/pestaña o el cliente no tiene remito todavía.
function invToggleManualVentaUI_(mostrarManual, mostrarSubmit) {
  if (mostrarSubmit === undefined) mostrarSubmit = mostrarManual;
  document.getElementById('invManualEntryWrap').classList.toggle('hidden', !mostrarManual);
  document.getElementById('invSubmitWrap').classList.toggle('hidden', !mostrarSubmit);
}

// Lista todos los clientes con ítems apartados activos ahora mismo (sea o
// no que ya tengan Remito generado), para no tener que buscar cliente por
// cliente.
function invRenderApartadosPendientes() {
  const box = document.getElementById('invApartadosPendientesBox');
  box.innerHTML = '<p class="helper">Buscando apartados pendientes…</p>';
  jsonp({ accion: 'obtenerApartadosPorProfesional' }, (err, data) => {
    if (inv.mov !== 'salida' && inv.mov !== 'apartado') return; // el usuario ya cambió de pestaña
    if (err || !(data && data.ok)) {
      box.innerHTML = '<p class="helper">No se pudo cargar la lista de apartados pendientes.</p>';
      return;
    }
    // Lo que YA se vendió (el remito ya se emitió) se saca de "pendiente" —
    // no tiene sentido ofrecerlo de nuevo acá. Los que están "Remitido"
    // (con un Remito todavía en Borrador, sin emitir) SÍ se muestran: hay
    // que poder tocarlos para terminar de editar/emitir ese remito.
    server('listAdmin', 'pedidos').then(function (pedidos) {
      const clientesYaRemitidos = new Set(
        pedidos.filter(p => p['Estado'] === 'Vendido').map(p => p['Cliente ID'])
      );
      const grupos = (data.profesionales || [])
        .filter(p => p.items && p.items.length)
        .filter(p => !clientesYaRemitidos.has(p.clienteId));
      renderApartadosPendientesLista_(box, grupos);
    }).catch(function () {
      renderApartadosPendientesLista_(box, (data.profesionales || []).filter(p => p.items && p.items.length));
    });
  });
}

function renderApartadosPendientesLista_(box, grupos) {
  if (!grupos.length) {
    box.innerHTML = '<p class="helper">No hay apartados pendientes ahora mismo.</p>';
    return;
  }
  box.innerHTML = grupos.map(function (g) {
    const cliente = state.clients.find(c => c['Cliente ID'] === g.clienteId);
    const nombre = cliente ? cliente['Nombre completo'] : (g.profesional || g.clienteId || 'Cliente');
    const resumen = g.items.map(it => `${it.tipo} ${it.medida} · ${it.cantidad}u`).join(', ');
    const itemsDetalle = g.items.map(function (it) {
      return `<div class="task-row ghost-row" style="padding:6px 10px 6px 22px;font-size:12px">
        <span style="color:var(--muted)">${html(it.tipo)} · ${html(it.medida)} · Lote ${html(it.lote)} · ${it.cantidad}u</span>
        <button type="button" class="ghost-button" style="padding:2px 10px;font-size:11px"
          data-del-apartado-cliente="${attr(g.clienteId || '')}" data-del-apartado-prof="${attr(g.profesional || '')}"
          data-del-apartado-tipo="${attr(it.tipo)}" data-del-apartado-medida="${attr(it.medida)}" data-del-apartado-lote="${attr(it.lote)}"
        >✕ Eliminar</button>
      </div>`;
    }).join('');
    return `<div class="task-row ghost-row" style="cursor:pointer" data-apartado-cliente="${attr(g.clienteId || '')}">
      <span><strong>${html(nombre)}</strong><small>${html(resumen)}</small></span>
      <span class="pill warning">${g.items.length} ítem${g.items.length === 1 ? '' : 's'}</span>
    </div>${itemsDetalle}`;
  }).join('');
  box.querySelectorAll('[data-apartado-cliente]').forEach(function (row) {
    row.onclick = () => invSeleccionarApartadoPendiente(row.dataset.apartadoCliente);
  });
  box.querySelectorAll('[data-del-apartado-cliente]').forEach(function (btn) {
    btn.onclick = function (event) { event.stopPropagation(); invEliminarItemApartado(btn.dataset); };
  });
}

// Elimina (a 0) un ítem apartado puntual: la cantidad vuelve al depósito
// (mismo mecanismo de ajustarApartado que ya usa el sistema al bajar una
// cantidad), para cuando esas unidades al final no se van a vender.
function invEliminarItemApartado(ds) {
  const detalle = ds.delApartadoTipo + ' ' + ds.delApartadoMedida + ' · Lote ' + ds.delApartadoLote;
  if (!window.confirm('¿Eliminar este ítem apartado (' + detalle + ')? La cantidad vuelve al depósito.')) return;
  jsonp({
    accion: 'ajustarApartado', profesional: ds.delApartadoProf || '', clienteId: ds.delApartadoCliente || '',
    tipo_imp: ds.delApartadoTipo, medida: ds.delApartadoMedida, lote_sel: ds.delApartadoLote, nueva_cantidad: 0
  }, (err, data) => {
    if (err || !(data && data.ok)) {
      return showError(new Error(data ? (data.error || data.mensaje) : (err ? err.message : 'No se pudo eliminar el ítem.')));
    }
    showToast('Ítem eliminado del apartado — la cantidad volvió al depósito.');
    inv.stockCargado = false;
    invRenderApartadosPendientes();
  });
}

function invSeleccionarApartadoPendiente(clienteId) {
  if (!clienteId) return showError(new Error('Este apartado no tiene un Cliente ID válido — abrilo desde Remitos.'));
  if (inv.mov === 'salida') { invClienteSeleccionar(clienteId); return; }
  if (inv.mov === 'apartado') { invAbrirApartadoParaEditar(clienteId); }
}

// Desde la pestaña Apartado: si el cliente ya tiene un Remito generado para
// su apartado (borrador o entregado), lo abre para editar/emitir. Si
// todavía no lo tiene, avisa que hay que generarlo desde el botón de abajo.
function invAbrirApartadoParaEditar(clienteId) {
  showToast('Buscando el remito de este apartado…');
  server('getPedidoConRemitoPorCliente', clienteId).then(function (pedido) {
    if (pedido && pedido.remitoId) {
      return server('getDocumentData', 'remito', pedido.remitoId).then(function (doc) {
        openEditRemit(Object.assign({}, doc.header, { items: doc.items }));
      });
    }
    showToast('Este apartado todavía no tiene remito — generalo desde el botón de abajo.');
  }).catch(showError);
}

// Llamada JSONP directa al doGet del archivo de Stock (acciones que NO
// están registradas en FUNCIONES_PANEL, así que no se puede usar server()).
function jsonp(params, cb) {
  var cbName = 'jscbInv_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  var script = document.createElement('script');
  var done = false;
  var timeoutId = setTimeout(function () {
    if (done) return;
    done = true;
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(new Error('El servidor no respondió a tiempo. Verificá que el Web App de Apps Script esté desplegado con la última versión del código.'), null);
  }, 55000);
  window[cbName] = function (data) {
    if (done) return;
    done = true;
    clearTimeout(timeoutId);
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(null, data);
  };
  script.onerror = function () {
    if (done) return;
    done = true;
    clearTimeout(timeoutId);
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(new Error('No se pudo conectar con el servidor.'), null);
  };
  var qs = '?callback=' + cbName;
  Object.keys(params).forEach(function (k) { qs += '&' + k + '=' + encodeURIComponent(params[k]); });
  script.src = URL_API + qs;
  document.body.appendChild(script);
}

function invCargarStock() {
  jsonp({ accion: 'obtenerTodoElStock' }, (err, data) => {
    if (data && data.ok && data.stock) {
      inv.stock = data.stock;
      inv.stockCargado = true;
    }
  });
  jsonp({ accion: 'obtenerMedidasPorTipo' }, (err, data) => {
    if (data && data.ok && data.medidas) { inv.medidas = data.medidas; }
  });
}

function invOnTipo() {
  const tipo = document.getElementById('invTipo').value;
  const selMed = document.getElementById('invMedida');
  selMed.innerHTML = '<option value="">— Seleccioná medida —</option>';
  document.getElementById('invLote').innerHTML = '<option value="">—</option>';
  document.getElementById('invLoteTexto').value = '';
  document.getElementById('invStockHint').textContent = '';
  if (inv.mov === 'deposito' && inv.carrito.length) {
    inv.carrito = [];
    invRenderCarrito();
  }
  if (!tipo) return;
  if (inv.mov === 'deposito') {
    const medidas = (inv.medidas && inv.medidas[tipo]) || [];
    medidas.forEach(m => selMed.insertAdjacentHTML('beforeend', `<option value="${attr(m.value)}">${html(m.label)}</option>`));
    return;
  }
  if (!inv.stock[tipo]) return;
  const medidasConStock = [...new Set(inv.stock[tipo].map(i => i.medida))];
  medidasConStock.forEach(m => selMed.insertAdjacentHTML('beforeend', `<option value="${attr(m)}">${html(m)}</option>`));
}

function invStockDisponible(tipo, medida, lote) {
  const item = (inv.stock[tipo] || []).find(i => i.medida === medida && i.lote === lote);
  const stockOriginal = item ? item.stock : 0;
  const yaEnCarrito = inv.carrito
    .filter(it => it.tipo_imp === tipo && it.medida === medida && it.lote_sel === lote)
    .reduce((a, it) => a + it.cantidad, 0);
  return stockOriginal - yaEnCarrito;
}

function invOnMedida() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const selLote = document.getElementById('invLote');
  selLote.innerHTML = '<option value="">— Seleccioná lote —</option>';
  (inv.stock[tipo] || []).filter(i => i.medida === medida).forEach(i => {
    const disp = invStockDisponible(tipo, medida, i.lote);
    if (disp <= 0) return;
    selLote.insertAdjacentHTML('beforeend', `<option value="${attr(i.lote)}">${html(i.lote)} (Disp: ${disp})</option>`);
  });
}

function invOnLote() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const lote = document.getElementById('invLote').value;
  if (!lote) { inv.stockMax = 0; document.getElementById('invStockHint').textContent = ''; return; }
  inv.stockMax = invStockDisponible(tipo, medida, lote);
  document.getElementById('invStockHint').textContent = `Disponible: ${inv.stockMax} u.`;
}

function invAgregarItem() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const cant = Number(document.getElementById('invCantidad').value) || 0;
  if (inv.mov === 'deposito') {
    const lote = document.getElementById('invLoteTexto').value.trim();
    if (!tipo || !medida) return showError(new Error('Elegí tipo y medida.'));
    if (!lote) return showError(new Error('Escribí el número de lote.'));
    if (cant <= 0) return showError(new Error('Ingresá una cantidad válida.'));
    inv.carrito.push({ tipo_imp: tipo, medida: medida, lote_sel: lote, cantidad: cant });
    invRenderCarrito();
    document.getElementById('invCantidad').value = '';
    document.getElementById('invMedida').value = '';
    return;
  }
  const lote = document.getElementById('invLote').value;
  if (!tipo || !medida || !lote) return showError(new Error('Elegí tipo, medida y lote.'));
  if (cant <= 0 || cant > inv.stockMax) return showError(new Error('Cantidad inválida o mayor al stock disponible (' + inv.stockMax + ').'));
  inv.carrito.push({ tipo_imp: tipo, medida: medida, lote_sel: lote, cantidad: cant });
  invRenderCarrito();
  document.getElementById('invCantidad').value = '';
  invOnMedida();
  document.getElementById('invLote').value = '';
  document.getElementById('invStockHint').textContent = '';
}

function invRenderCarrito() {
  document.getElementById('invCartList').innerHTML = inv.carrito.length
    ? inv.carrito.map((it, idx) => `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(it.tipo_imp)} · ${html(it.medida)} · ${html(it.lote_sel)} · ${it.cantidad}u
        <button type="button" style="border:none;background:none;color:#c0392b;font-weight:800;margin-left:6px;cursor:pointer" onclick="invQuitarItem(${idx})">×</button></div>`).join('')
    : empty('Sin ítems todavía.');
}

function invQuitarItem(idx) {
  inv.carrito.splice(idx, 1);
  invRenderCarrito();
  invOnMedida();
}

function invClienteBuscarInput() {
  document.getElementById('invClienteId').value = '';
  invClienteLimpiarCampos();
  const q = normalize(document.getElementById('invClienteBuscar').value);
  const box = document.getElementById('invClienteResultados');
  if (!q) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const matches = state.clients.filter(c =>
    normalize(c['Nombre completo']).includes(q) || normalize(c['CUIL']).includes(q) || normalize(c['Localidad']).includes(q)
  ).slice(0, 8);
  box.innerHTML = matches.length
    ? matches.map(c => `<div class="task-row ghost-row" style="cursor:pointer" data-cliente="${attr(c['Cliente ID'])}">
        <span><strong>${html(c['Nombre completo'])}</strong><small>${html(c['CUIL'] || '')} ${c['Localidad'] ? '· ' + html(c['Localidad']) : ''}</small></span>
      </div>`).join('')
    : `<div class="task-row"><span>Sin coincidencias — se va a cargar como cliente nuevo.</span></div>`;
  box.classList.remove('hidden');
  box.querySelectorAll('[data-cliente]').forEach(row => { row.onclick = () => invClienteSeleccionar(row.dataset.cliente); });
}

function invClienteSeleccionar(id) {
  const client = state.clients.find(c => c['Cliente ID'] === id);
  if (!client) return;
  document.getElementById('invClienteId').value = id;
  document.getElementById('invClienteBuscar').value = client['Nombre completo'] || '';
  document.getElementById('invClienteResultados').classList.add('hidden');
  document.getElementById('invNombre').value = client['Nombre'] || '';
  document.getElementById('invApellido').value = client['Apellido'] || '';
  document.getElementById('invCuil').value = client['CUIL'] || '';
  document.getElementById('invLocalidad').value = client['Localidad'] || '';
  if (inv.mov === 'salida') invBuscarApartadoCliente(id);
}

function invBuscarApartadoCliente(clienteId) {
  const box = document.getElementById('invApartadoBox');
  box.innerHTML = '<p>Buscando apartados de este cliente…</p>';
  box.classList.remove('hidden');
  inv.pedidoConRemito = null;
  // Primero: ¿este cliente ya tiene un Remito para su apartado (borrador o
  // ya emitido)? Si es así, no repetimos el circuito.
  server('getPedidoConRemitoPorCliente', clienteId).then(function (pedido) {
    if (pedido) {
      inv.apartadoActivo = null;
      inv.usandoApartado = false;
      const yaVendido = pedido.remitoEstado === 'Entregado';
      if (yaVendido) {
        // Ya no queda nada para registrar acá — se oculta todo y se deja
        // solo un link para ver/reimprimir.
        invToggleManualVentaUI_(false, false);
        document.getElementById('invCartList').innerHTML = empty('El remito de este cliente ya se emitió.');
        box.innerHTML = `
          <div class="pill warning" style="margin-bottom:8px">Este cliente ya está vendido (Remito ${html(pedido.remitoId)})</div>
          <button type="button" class="secondary-button" id="invIrARemito">Ver remito</button>`;
        document.getElementById('invIrARemito').onclick = () => openOrderById(pedido.orderId);
        return;
      }
      // Todavía hay un Remito en Borrador: se muestran sus ítems y se
      // ofrece ir a revisarlo/emitirlo desde Remitos.
      invToggleManualVentaUI_(false, false);
      box.innerHTML = `<div class="pill warning">Este cliente ya tiene un remito en borrador (${html(pedido.remitoId)}) — revisalo/emitilo desde ahí.</div>
        <button type="button" class="secondary-button" id="invIrARemitoBorrador" style="margin-top:8px">Ver / emitir remito</button>`;
      document.getElementById('invCartList').innerHTML = '<p class="helper">Cargando ítems del remito…</p>';
      server('getDocumentData', 'remito', pedido.remitoId).then(function (doc) {
        if (inv.pedidoConRemito !== null && inv.pedidoConRemito !== pedido) return;
        document.getElementById('invCartList').innerHTML = (doc.items || []).length
          ? doc.items.map(i => `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(i['Producto'] || '')} · ${html(i['Cantidad'])}u${i['Lote'] ? ' · Lote ' + html(i['Lote']) : ''}</div>`).join('')
          : empty('Sin ítems.');
        document.getElementById('invIrARemitoBorrador').onclick = () => openEditRemit(Object.assign({}, doc.header, { items: doc.items }));
      }).catch(function () {
        document.getElementById('invCartList').innerHTML = '<p class="helper">No se pudieron cargar los ítems del remito.</p>';
      });
      inv.pedidoConRemito = pedido;
      return;
    }
    invBuscarApartadoCrudo(clienteId, box);
  }).catch(function () {
    invBuscarApartadoCrudo(clienteId, box);
  });
}

function invBuscarApartadoCrudo(clienteId, box) {
  jsonp({ accion: 'obtenerApartadosPorProfesional' }, (err, data) => {
    const grupo = (data && data.ok) ? data.profesionales.find(p => p.clienteId === clienteId) : null;
    if (!grupo || !grupo.items.length) {
      box.classList.add('hidden');
      box.innerHTML = '';
      inv.apartadoActivo = null;
      inv.usandoApartado = false;
      inv.pedidoConRemito = null;
      // Este cliente no tiene ningún apartado activo: acá sí corresponde
      // la carga manual (venta directa de stock, sin apartado de por medio).
      invToggleManualVentaUI_(true);
      invRenderCarrito();
      return;
    }
    inv.apartadoActivo = grupo;
    inv.pedidoConRemito = null;
    // Todavía no hay Remito: el circuito pasa por generarlo primero.
    invToggleManualVentaUI_(false, false);
    document.getElementById('invCartList').innerHTML = grupo.items.map(it =>
      `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(it.tipo)} · ${html(it.medida)} · ${html(it.lote)} · ${it.cantidad}u</div>`).join('');
    box.innerHTML = `
      <div class="pill warning" style="margin-bottom:8px">Este cliente tiene un apartado activo — todavía sin remito. Los ítems ya se muestran abajo; generá el remito para poder emitirlo y registrar la venta.</div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="primary-button" id="invGenerarRemito">Generar remito para este apartado</button>
      </div>`;
    document.getElementById('invGenerarRemito').onclick = () => invGenerarRemitoParaApartado_(clienteId);
  });
}

// Genera el Remito Borrador del apartado activo de este cliente y lo abre
// para revisar/editar/emitir — todo en UN solo viaje al servidor
// (generarRemitoBorradorApartadoCliente busca el Pedido, crea el Remito y
// devuelve el documento completo ya armado). Antes esto eran 4 llamadas
// seguidas y se sentía lento.
function invGenerarRemitoParaApartado_(clienteId) {
  const btn = document.getElementById('invGenerarRemito');
  if (btn) { btn.disabled = true; btn.textContent = 'Generando…'; }
  server('generarRemitoBorradorApartadoCliente', clienteId).then(function (result) {
    showToast('Remito generado en borrador.');
    inv.stockCargado = false;
    refresh();
    openEditRemit(Object.assign({}, result.doc.header, { items: result.doc.items }));
  }).catch(function (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Generar remito para este apartado'; }
    showError(err);
  });
}

function invClienteLimpiarCampos() {
  ['invNombre', 'invApellido', 'invCuil', 'invLocalidad'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = '';
  });
}

function invClienteClickAfuera(event) {
  const box = document.getElementById('invClienteResultados');
  const input = document.getElementById('invClienteBuscar');
  if (!box || box.classList.contains('hidden')) return;
  if (event.target === input || box.contains(event.target)) return;
  box.classList.add('hidden');
}

function invSubmit() {
  if (inv.mov === 'deposito') return invSubmitDeposito();
  if (inv.mov === 'apartado') return invSubmitApartado();
  return invSubmitVenta();
}

function invSubmitDeposito() {
  const tipo = document.getElementById('invTipo').value;
  if (!tipo) return showError(new Error('Elegí el tipo de implante.'));
  const medidaSuelta = document.getElementById('invMedida').value;
  const cantSuelta = Number(document.getElementById('invCantidad').value) || 0;
  if (medidaSuelta && cantSuelta > 0) invAgregarItem();
  if (!inv.carrito.length) return showError(new Error('Agregá al menos una medida con su cantidad y su lote.'));
  document.getElementById('invSubmit').disabled = true;
  jsonp({
    accion: 'registrarDepositoMultiple', tipo_imp: tipo,
    items_json: JSON.stringify(inv.carrito.map(it => ({ medida: it.medida, lote: it.lote_sel, cantidad: it.cantidad }))),
    profesional: '', observacion: 'Cargado desde Panel'
  }, (err, data) => {
    document.getElementById('invSubmit').disabled = false;
    if (data && data.ok) {
      const n = inv.carrito.length;
      showToast('Depósito registrado (' + n + (n === 1 ? ' medida' : ' medidas') + ').');
      inv.stockCargado = false;
      renderInventory();
    } else {
      showError(new Error(data ? (data.error || data.mensaje) : (err ? err.message : 'No hubo respuesta.')));
    }
  });
}

// Venta SIN apartado: igual que la venta con apartado, ya no se descuenta
// stock ni se vende en el acto. Se genera el Remito en Borrador con los
// ítems del carrito y se abre para revisar/editar — recién al tocar
// "Emitir remito" ahí adentro se descuenta el stock real, se genera el
// PDF y se registra la venta.
function invSubmitVenta() {
  if (!inv.carrito.length) return showError(new Error('Agregá al menos un ítem.'));
  const clientId = document.getElementById('invClienteId').value;
  let payload = { items: inv.carrito };
  if (clientId) {
    payload.clientId = clientId;
  } else {
    const nombre = document.getElementById('invNombre').value.trim();
    if (!nombre) return showError(new Error('Elegí un cliente existente o cargá los datos de uno nuevo.'));
    payload.cliente = {
      'Nombre': nombre, 'Apellido': document.getElementById('invApellido').value.trim(),
      'CUIL': document.getElementById('invCuil').value.trim(), 'Localidad': document.getElementById('invLocalidad').value.trim()
    };
  }
  document.getElementById('invSubmit').disabled = true;
  // crearRemitoBorradorVentaDirecta ya devuelve el documento completo —
  // un viaje menos al servidor que antes (no hace falta un getDocumentData aparte).
  server('crearRemitoBorradorVentaDirecta', payload).then(function (result) {
    document.getElementById('invSubmit').disabled = false;
    showToast('Remito generado en borrador. Revisalo y emitilo para confirmar la venta.');
    inv.carrito = [];
    inv.stockCargado = false;
    renderInventory();
    refresh();
    openEditRemit(Object.assign({}, result.doc.header, { items: result.doc.items }));
  }).catch(function (err) {
    document.getElementById('invSubmit').disabled = false;
    showError(err);
  });
}

// Registra el apartado y, automáticamente (sin pasos intermedios), genera
// el Remito Borrador de ese apartado y lo abre para revisar/editar. Si algo
// del remito falla, el apartado igual queda registrado: se avisa y se puede
// generar el remito a mano después desde Inventario > Apartado o desde el
// Pedido correspondiente.
function invSubmitApartado() {
  if (!inv.carrito.length) return showError(new Error('Agregá al menos un ítem.'));
  const clientId = document.getElementById('invClienteId').value;
  const params = { accion: 'registrarApartadoMultiple', items_json: JSON.stringify(inv.carrito), observacion: 'Cargado desde Panel' };
  if (clientId) {
    params.clienteId = clientId;
    const client = state.clients.find(c => c['Cliente ID'] === clientId);
    params.profesional = client ? client['Nombre completo'] : '';
  } else {
    const nombre = document.getElementById('invNombre').value.trim();
    if (!nombre) return showError(new Error('Elegí un cliente existente o cargá los datos de uno nuevo.'));
    params.cliente_json = JSON.stringify({
      'Nombre': nombre, 'Apellido': document.getElementById('invApellido').value.trim(),
      'CUIL': document.getElementById('invCuil').value.trim(), 'Localidad': document.getElementById('invLocalidad').value.trim()
    });
  }
  document.getElementById('invSubmit').disabled = true;
  jsonp(params, (err, data) => {
    try {
      if (err) { document.getElementById('invSubmit').disabled = false; return showError(err); }
      if (!(data && data.ok)) {
        document.getElementById('invSubmit').disabled = false;
        return showError(new Error(data ? (data.error || data.mensaje) : 'No hubo respuesta.'));
      }
      showToast('Apartado registrado.');
      inv.stockCargado = false;
      const orderId = data.orderId;
      if (!orderId) { renderInventory(); return; }
      server('crearRemitoBorradorDesdeApartado', { orderId: orderId })
        .then(function () {
          showToast('Remito generado en borrador. Revisalo, corregí lotes/cantidades si hace falta desde Remitos, y emitilo cuando esté listo para vender.');
          renderInventory();
          refresh();
        })
        .catch(function (err2) {
          showToast('El apartado se registró, pero no se pudo generar el remito automáticamente: ' + (err2 && err2.message ? err2.message : err2) + '. Podés generarlo manualmente desde el Pedido, en Pedidos.', true);
          renderInventory();
          refresh();
        });
    } catch (ex) {
      document.getElementById('invSubmit').disabled = false;
      showError(ex);
    }
  });
}

function loadView(moduleKey) {
  document.getElementById('appContent').innerHTML = loading();
  server('listAdmin', moduleKey).then(function (records) {
    state.records[moduleKey] = records;
    renderTable(moduleKey, records);
  }).catch(showError);

// Pedidos "cerrados": ya terminaron su circuito (vendidos) o se
// cancelaron. Por defecto la pestaña de Pedidos solo muestra los
// activos — hay un botón para ver los cerrados sin perderlos de vista.
const CLOSED_ORDER_STATES = ['Vendido', 'Cancelado'];

function renderTable(moduleKey, records) {
  const meta = views[moduleKey];
  const isPedidos = moduleKey === 'pedidos';
  if (isPedidos && state.mostrarPedidosCerrados === undefined) state.mostrarPedidosCerrados = false;
  const closedCount = isPedidos ? records.filter(r => CLOSED_ORDER_STATES.includes(r['Estado'])).length : 0;
  const toggleClosedButton = (isPedidos && closedCount)
    ? `<button class="ghost-button" id="togglePedidosCerrados">${state.mostrarPedidosCerrados ? 'Ver solo activos' : 'Ver cerrados (' + closedCount + ')'}</button>`
    : '';
  const visibleRecords = (isPedidos && !state.mostrarPedidosCerrados)
    ? records.filter(r => !CLOSED_ORDER_STATES.includes(r['Estado']))
    : records;
  document.getElementById('appContent').innerHTML = `
    <div class="view-toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Buscar en ${html(meta.title.toLowerCase())} …">
      ${toggleClosedButton}
      <span class="pill neutral">${visibleRecords.length} registro${visibleRecords.length === 1 ? '' : 's'}</span>
    </div>
    <div id="tableContent">${tableHtml(moduleKey, visibleRecords)}</div>`;
  if (isPedidos && closedCount) {
    document.getElementById('togglePedidosCerrados').onclick = function () {
      state.mostrarPedidosCerrados = !state.mostrarPedidosCerrados;
      renderTable(moduleKey, records);
    };
  }
  document.getElementById('searchInput').addEventListener('input', function (event) {
    const query = normalize(event.target.value);
    const filtered = visibleRecords.filter(r => normalize(JSON.stringify(r)).includes(query));
    document.getElementById('tableContent').innerHTML = tableHtml(moduleKey, filtered);
    bindRows(moduleKey);
  });
  bindRows(moduleKey);
}

function tableHtml(moduleKey, records) {
  const meta = views[moduleKey];
  if (!records.length) return empty('Todavía no hay ' + meta.title.toLowerCase() + '.');
  return `<div class="table-wrap"><table>
    <thead><tr>${meta.columns.map(c => `<th>${html(c)}</th>`).join('')}<th>Acciones</th></tr></thead>
    <tbody>${records.map(function (r) {
      return `<tr>${meta.columns.map(c => `<td>${cell(c, r[c])}</td>`).join('')}<td>${rowActions(moduleKey, r)}</td></tr>`;
    }).join('')}</tbody>
  </table></div>`;
}

function rowActions(moduleKey, r) {
  if (moduleKey === 'clientes') return `<div class="row-actions"><button class="ghost-button" data-edit-client="${attr(r['Cliente ID'])}">Editar</button></div>`;
  if (moduleKey === 'productos') return `<div class="row-actions"><button class="ghost-button" data-edit-product="${attr(r['Producto ID'])}">Editar</button></div>`;
  if (moduleKey === 'pedidos') return `<div class="row-actions"><button class="ghost-button" data-open-order="${attr(r['Pedido ID'])}">Abrir</button><button class="ghost-button" data-edit-order="${attr(r['Pedido ID'])}">Editar</button></div>`;
  if (moduleKey === 'remitos') return `<div class="row-actions">
    <button class="ghost-button" data-edit-remit="${attr(r['Remito ID'])}">Editar</button>
    ${r['Estado'] === 'Entregado'
      ? `<button class="ghost-button" data-print-remit="${attr(r['Remito ID'])}">Imprimir</button><span class="pill success">Vendido</span>`
      : (r['Estado'] === 'Cancelado' ? `<span class="pill neutral">Cancelado</span>` : `<button class="primary-button" data-emit-remit="${attr(r['Remito ID'])}">Emitir remito</button>`)}
  </div>`;
  return '';
}

function bindRows(moduleKey) {
  document.querySelectorAll('[data-edit-client]').forEach(b => b.onclick = () => openClientForm(findRecord('clientes', 'Cliente ID', b.dataset.editClient)));
  document.querySelectorAll('[data-edit-product]').forEach(b => b.onclick = () => openProductForm(findRecord('productos', 'Producto ID', b.dataset.editProduct)));
  document.querySelectorAll('[data-open-order]').forEach(b => b.onclick = () => openOrderById(b.dataset.openOrder));
  document.querySelectorAll('[data-edit-order]').forEach(b => b.onclick = () => openEditOrder(findRecord('pedidos', 'Pedido ID', b.dataset.editOrder)));
  document.querySelectorAll('[data-edit-remit]').forEach(b => b.onclick = () => openEditRemit(findRecord('remitos', 'Remito ID', b.dataset.editRemit)));
  document.querySelectorAll('[data-print-remit]').forEach(b => b.onclick = () => printDocument('remito', b.dataset.printRemit));
  document.querySelectorAll('[data-emit-remit]').forEach(b => b.onclick = () => confirmEmitirRemito(b.dataset.emitRemit));
}

// "Generar remito" arma el Remito en Borrador de este pedido (con los
// ítems de Pedido Detalle) y lo abre para revisar/editar antes de emitir —
// mismo circuito Borrador -> Emitir que usan los pedidos de Apartado. Si el
// pedido ya tiene un remito, el botón dice "Ver remito" y va directo a
// abrirlo (editable si sigue en Borrador, de solo lectura si ya se emitió).
function openOrder(order) {
  if (!order) return showError(new Error('Pedido no encontrado.'));
  state.currentOrder = order;
  const yaRemitado = order['Estado'] === 'Remitido' || order['Estado'] === 'Vendido';
  openModal('Pedido ' + order['Pedido ID'], `
    <div class="form-grid">
      <div class="field"><label>Cliente</label><strong>${html(order['Cliente'])}</strong></div>
      <div class="field"><label>Fecha</label><span>${html(order['Fecha y hora'])}</span></div>
      <div class="field"><label>Origen</label><span>${html(order['Origen'])}</span></div>
      <div class="field"><label>Estado</label><span class="pill ${pillClass(order['Estado'])}">${html(order['Estado'])}</span></div>
      <div class="field full"><label>Entrega</label><span>${html(order['Forma de entrega'])} ${order['Dirección de entrega'] ? '· ' + html(order['Dirección de entrega']) : ''}</span></div>
      <div class="field full"><label>Productos</label>
        <div class="table-wrap"><table><thead><tr><th>Producto</th><th>Cantidad</th></tr></thead><tbody>
          ${(order.items || []).map(i => `<tr><td>${html(i['Producto'])}</td><td>${html(i['Cantidad'])}</td></tr>`).join('')}
        </tbody></table></div>
      </div>
      <div class="form-actions">
        <button class="secondary-button" type="button" id="editOrder">Editar pedido</button>
        <button class="primary-button" type="button" id="remitFromOrder">${yaRemitado ? 'Ver remito' : 'Generar remito'}</button>
      </div>
    </div>`);
  document.getElementById('editOrder').onclick = () => openEditOrder(order);
  document.getElementById('remitFromOrder').onclick = function () {
    const btn = document.getElementById('remitFromOrder');
    btn.disabled = true;
    if (yaRemitado) {
      server('listAdmin', 'remitos').then(function (remitos) {
        const remito = remitos.find(r => r['Pedido ID'] === order['Pedido ID']);
        btn.disabled = false;
        if (!remito) return showError(new Error('No se encontró el remito de este pedido.'));
        openEditRemit(remito);
      }).catch(function (err) { btn.disabled = false; showError(err); });
      return;
    }
    prepararItemsRemitoDesdeOrder_(order).then(function (items) {
      return server('createRemitFromOrder', { orderId: order['Pedido ID'], date: todayIso(), items: items, estadoInicial: 'Borrador' });
    }).then(function () {
      return refresh().then(function () { return server('listAdmin', 'remitos'); });
    }).then(function (remitos) {
      btn.disabled = false;
      closeModal();
      const remito = remitos.find(r => r['Pedido ID'] === order['Pedido ID']);
      if (remito) openEditRemit(remito);
    }).catch(function (err) { btn.disabled = false; showError(err); });
  };
}

// Arma los ítems del remito (producto, cantidad y lote) a partir de Pedido
// Detalle — ya no hay Presupuesto del que leerlos.
function prepararItemsRemitoDesdeOrder_(order) {
  return Promise.resolve((order.items || []).map(function (i) {
    return { productId: i['Producto ID'], codigo: i['Código'], producto: i['Producto'], quantity: toNumber(i['Cantidad']), lot: i['Lote'] || '' };
  }));
}

// Número de remito Via Cargo: prefijo de agencia (4 dígitos, entre 5090 y
// 9090, elegible de una lista) + el resto del número, que se escribe a
// mano — es un dato DISTINTO del número de seguimiento (que es un campo
// libre aparte).
const VIA_CARGO_PREFIJOS_ = ['5090', '9090'];
function viaCargoCamposHtml_(prefijoActual, restoActual) {
  const prefijoConocido = VIA_CARGO_PREFIJOS_.indexOf(prefijoActual) !== -1;
  const prefijoManual = !!prefijoActual && !prefijoConocido;
  return `<div class="field full">
    <label>Número de remito Via Cargo (opcional)</label>
    <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:0 0 130px">
        <select id="viaCargoPrefijo">
          <option value="">— Prefijo —</option>
          ${VIA_CARGO_PREFIJOS_.map(p => `<option value="${p}" ${p === prefijoActual ? 'selected' : ''}>${p}</option>`).join('')}
          <option value="__otro__" ${prefijoManual ? 'selected' : ''}>Otro…</option>
        </select>
        <input type="text" id="viaCargoPrefijoManual" class="${prefijoManual ? '' : 'hidden'}" value="${attr(prefijoManual ? prefijoActual : '')}" maxlength="4" placeholder="Ej: 5090" style="margin-top:4px;width:100%">
      </div>
      <input type="text" id="viaCargoResto" value="${attr(restoActual || '')}" placeholder="Resto del número" style="flex:1;min-width:140px">
    </div>
    <small style="color:var(--muted)">Prefijo de agencia (entre 5090 y 9090) + el resto del número, a mano.</small>
  </div>`;
}
function wireViaCargoCampos_() {
  const select = document.getElementById('viaCargoPrefijo');
  const manual = document.getElementById('viaCargoPrefijoManual');
  if (!select) return;
  select.onchange = function () {
    if (select.value === '__otro__') { manual.classList.remove('hidden'); manual.focus(); }
    else { manual.classList.add('hidden'); manual.value = ''; }
  };
}
function leerViaCargoNumero_() {
  const select = document.getElementById('viaCargoPrefijo');
  if (!select) return '';
  const manual = document.getElementById('viaCargoPrefijoManual');
  const resto = document.getElementById('viaCargoResto');
  const prefijo = select.value === '__otro__' ? (manual ? manual.value.trim() : '') : select.value;
  const restoVal = resto ? resto.value.trim() : '';
  return (prefijo || '') + restoVal;
}
function parseViaCargoNumero_(valor) {
  valor = String(valor || '').trim();
  if (!valor) return { prefijo: '', resto: '' };
  const prefijo4 = valor.slice(0, 4);
  if (VIA_CARGO_PREFIJOS_.indexOf(prefijo4) !== -1) return { prefijo: prefijo4, resto: valor.slice(4) };
  return { prefijo: '', resto: valor };
}

// Bloquea los renglones de producto/cantidad/lote de una lista de ítems ya
// cargada (deshabilita selects/inputs/botón de quitar) — se usa en "Editar

// Ventana de "Emitir remito" desde la tabla de Remitos: confirma y, si el
// usuario prefiere revisar antes, manda a abrir el editor en vez de emitir
