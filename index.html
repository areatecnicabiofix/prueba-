<!DOCTYPE html>
<!-- BIOFIX_PANEL_V13_REMITO_DESDE_PRESUPUESTO -->
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <style>
  :root {
    --petrol: #061a24;
    --petrol-hover: #0b2632;
    --red: #c8162e;
    --red-hover: #a91227;
    --ink: #1b2a30;
    --muted: #6d7c82;
    --line: #dce4e7;
    --line-soft: #e8eef0;
    --bg: #f4f7f8;
    --surface: #fff;
    --blue-soft: #eaf3ff;
    --blue: #2366b1;
    --red-soft: #fce9ec;
    --green-soft: #e9f6ef;
    --green: #247a56;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { color: var(--ink); background: var(--bg); font-family: Inter, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  h1, h2, h3, p { margin-top: 0; }
  .brandbar {
    height: 72px; padding: 0 36px; color: #fff; background: var(--petrol);
    display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(3,21,29,.18);
  }
  .brand { display: flex; align-items: center; gap: 7px; font-size: 19px; }
  .brand strong { font-weight: 750; }
  .brand span { font-weight: 400; }
  .brand-mark { width: 36px; height: 36px; margin-right: 7px; border: 1px solid #fff; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 850; }
  .profile { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; }
  .profile-icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--petrol); font-size: 13px; }
  .module-nav {
    height: 56px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: stretch; gap: 2px; overflow-x: auto; scrollbar-width: thin;
  }
  .nav-item {
    flex: 0 0 auto; min-width: max-content; padding: 0 19px; border: 0; border-bottom: 4px solid transparent;
    color: #31434a; background: transparent; font-size: 14px; font-weight: 550; transition: 160ms ease-out;
  }
  .nav-item:hover { background: #f7f9fa; }
  .nav-item.active { color: var(--ink); border-bottom-color: var(--red); font-weight: 700; }
  .main { width: min(100%, 1440px); margin: 0 auto; }
  .page-header { min-height: 144px; padding: 36px 36px 24px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .eyebrow { margin-bottom: 7px; color: var(--red); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin-bottom: 7px; font-size: clamp(25px, 3vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
  h2 { margin-bottom: 0; font-size: 22px; letter-spacing: -.025em; }
  h3 { margin-bottom: 0; font-size: 18px; }
  .page-subtitle, .today { margin-bottom: 0; color: var(--muted); font-size: 14px; }
  .header-actions { display: flex; align-items: center; gap: 16px; }
  .primary-button, .secondary-button, .ghost-button, .danger-button, .icon-button {
    min-height: 44px; border: 0; border-radius: 8px; font-weight: 700; transition: 160ms ease-out;
  }
  .primary-button { padding: 0 20px; color: #fff; background: var(--red); box-shadow: 0 6px 14px rgba(200,22,46,.16); }
  .primary-button:hover { background: var(--red-hover); transform: translateY(-1px); }
  .secondary-button { padding: 0 16px; color: var(--petrol); background: #e9f0f2; }
  .ghost-button { min-height: 36px; padding: 0 10px; color: var(--petrol); background: transparent; }
  .ghost-button:hover { background: #f1f5f6; }
  .danger-button { padding: 0 16px; color: var(--red); background: var(--red-soft); }
  .icon-button { width: 40px; color: var(--muted); background: #eef3f4; font-size: 22px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(200,22,46,.22); outline-offset: 2px; }
  .content { padding: 0 36px 44px; }
  .metric-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .metric-card, .panel, .loading-card, .inventory-card { background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 7px rgba(6,26,36,.05); }
  .metric-card { min-height: 132px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
  .metric-label { color: var(--muted); font-size: 13px; font-weight: 650; }
  .metric-value { font-size: 30px; line-height: 1; font-weight: 780; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .metric-card.urgent { border-color: #efc8cf; }
  .metric-card.urgent .metric-value { color: var(--red); }
  .dashboard-grid { display: grid; grid-template-columns: 7fr 5fr; gap: 20px; margin-top: 20px; }
  .panel { padding: 26px; }
  .panel-header, .view-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 17px; }
  .task-list { display: grid; }
  .task-row { min-height: 64px; padding: 10px 4px; border-top: 1px solid var(--line-soft); display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; }
  .task-row:first-child { border-top: 0; }
  .task-row strong { display: block; margin-bottom: 3px; font-size: 14px; }
  .task-row small { color: var(--muted); }
  .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .quick-action { min-height: 75px; padding: 15px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; text-align: left; font-weight: 650; transition: 160ms ease-out; }
  .quick-action:hover { border-color: #b8c7cc; background: #f8fafb; transform: translateY(-1px); }
  .quick-action small { display: block; margin-top: 5px; color: var(--muted); font-weight: 450; }
  .view-toolbar { margin-bottom: 14px; }
  .search { width: min(420px, 100%); height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  table { width: 100%; border-collapse: collapse; min-width: 850px; }
  th { padding: 13px 14px; color: var(--muted); background: #f8fafb; border-bottom: 1px solid var(--line); text-align: left; font-size: 11px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
  td { padding: 13px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: #fafcfc; }
  .row-actions { display: flex; gap: 4px; white-space: nowrap; }
  .amount { font-weight: 750; font-variant-numeric: tabular-nums; }
  .pill { display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 5px; color: var(--blue); background: var(--blue-soft); font-size: 11px; font-weight: 700; }
  .pill.warning { color: var(--red); background: var(--red-soft); }
  .pill.success { color: var(--green); background: var(--green-soft); }
  .pill.neutral { color: #536168; background: #f0f2f3; }
  .empty-state { padding: 48px 20px; color: var(--muted); text-align: center; }
  .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); }
  .inventory-card { min-height: 260px; padding: 32px; display: grid; place-items: center; text-align: center; }
  .inventory-card p { max-width: 520px; margin: 10px auto 0; color: var(--muted); }
  .modal-backdrop { position: fixed; inset: 0; z-index: 100; padding: 24px; background: rgba(3,17,22,.62); display: grid; place-items: center; backdrop-filter: blur(5px); }
  .modal { width: min(1040px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 14px; background: #fff; box-shadow: 0 28px 80px rgba(0,0,0,.25); }
  .modal-header { padding: 23px 26px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .form-grid { padding: 22px 26px 26px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
  .field { display: grid; gap: 7px; }
  .field.full { grid-column: 1 / -1; }
  .field label { color: #4f5d62; font-size: 12px; font-weight: 750; }
  .field input, .field select, .field textarea { width: 100%; min-height: 43px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; }
  .field textarea { min-height: 86px; resize: vertical; }
  .form-actions { grid-column: 1 / -1; padding-top: 8px; display: flex; justify-content: flex-end; gap: 9px; }
  .line-items { grid-column: 1 / -1; display: grid; gap: 9px; }
  .line-item { display: grid; grid-template-columns: 1fr 105px 130px 44px; gap: 8px; align-items: end; padding: 12px; border: 1px solid var(--line-soft); border-radius: 9px; background: #fbfcfc; }
  .line-item.remit { grid-template-columns: 1fr 90px 190px 44px; }
  /* Presupuesto: Producto ocupa todo el renglón de arriba (budget-producto,
     grid-column 1/-1) y abajo van Cantidad + Precio + Lote (3 columnas
     iguales) + el botón de quitar (44px) — mismo patrón que .line-item.remit. */
  .line-item.budget { grid-template-columns: repeat(3, 1fr) 44px; }
  .line-item.budget .field.budget-producto { grid-column: 1 / -1; }
  .section-label { grid-column: 1 / -1; margin: 5px 0 -3px; font-size: 14px; font-weight: 800; }
  .toast { position: fixed; top: 88px; right: 24px; z-index: 120; max-width: 360px; padding: 13px 16px; border-radius: 8px; color: #fff; background: var(--petrol); box-shadow: 0 12px 34px rgba(6,26,36,.20); font-size: 13px; font-weight: 700; }
  .toast.error { background: var(--red-hover); }
  .loading-card { min-height: 270px; display: grid; place-items: center; align-content: center; color: var(--muted); }
  .spinner { width: 34px; height: 34px; border: 3px solid #dce7e9; border-top-color: var(--petrol); border-radius: 50%; animation: spin .8s linear infinite; }
  .loading-card p { margin: 13px 0 0; }
  .hidden { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 1120px) {
    .metric-grid { grid-template-columns: repeat(2, 1fr); }
    .dashboard-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .brandbar { padding: 0 18px; }
    .profile { font-size: 0; }
    .module-nav { padding: 0 8px; }
    .nav-item { padding: 0 14px; }
    .page-header { padding: 26px 17px 20px; align-items: flex-start; flex-direction: column; }
    .header-actions { width: 100%; justify-content: space-between; }
    .content { padding: 0 16px 32px; }
    .metric-grid { grid-template-columns: 1fr; }
    .quick-grid { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; padding: 19px; }
    .field.full, .form-actions, .line-items, .section-label { grid-column: auto; }
    .line-item, .line-item.remit, .line-item.budget { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
  </head>
  <body>
    <header class="brandbar">
      <div class="brand">
        <div class="brand-mark">BF</div>
        <strong>Bio-Fix</strong><span>Gestión</span>
      </div>
      <div class="profile"><span class="profile-icon">●</span> Administración</div>
    </header>
    <nav class="module-nav" aria-label="Módulos">
      <button class="nav-item active" data-view="inicio">Inicio</button>
      <button class="nav-item" data-view="clientes">Clientes</button>
      <button class="nav-item" data-view="pedidos">Pedidos</button>
      <button class="nav-item" data-view="presupuestos">Presupuestos</button>
      <button class="nav-item" data-view="remitos">Remitos</button>
      <button class="nav-item" data-view="productos">Productos pedidos/remitos</button>
      <button class="nav-item" data-view="inventario">Inventario</button>
    </nav>
    <main class="main">
      <header class="page-header">
        <div>
          <p class="eyebrow">Bio-Fix · Administración</p>
          <h1 id="pageTitle">Buen día, Administración</h1>
          <p class="page-subtitle" id="pageSubtitle">Resumen de hoy</p>
        </div>
        <div class="header-actions">
          <span class="today" id="today"></span>
          <button class="primary-button" id="newButton">＋ Nuevo pedido</button>
        </div>
      </header>
      <section id="appContent" class="content">
        <div class="loading-card"><div class="spinner"></div><p>Cargando gestión Bio-Fix…</p></div>
      </section>
    </main>
    <div class="modal-backdrop hidden" id="modalBackdrop">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-header">
          <div>
            <p class="eyebrow" id="modalEyebrow">Nuevo registro</p>
            <h2 id="modalTitle">Cargar información</h2>
          </div>
          <button class="icon-button" id="closeModal" aria-label="Cerrar">×</button>
        </header>
        <div id="modalContent"></div>
      </section>
    </div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <script>
  var URL_API = 'https://script.google.com/macros/s/AKfycbwASHKaBSwXmiOsLNOCKReRvgESrM0RekWyWj0mbSrexxCGhglP2M2atyC-DxcJghBD/exec';
  const state = {
    view: 'inicio',
    bootstrap: null,
    products: [],
    clients: [],
    records: {},
    currentOrder: null
  };
  const views = {
    clientes: { title: 'Clientes', singular: 'cliente', columns: ['Cliente ID', 'Nombre completo', 'CUIL', 'Matrícula profesional', 'Localidad', 'Provincia', 'Estado'] },
    productos: { title: 'Productos para pedidos y remitos', singular: 'producto detallado', columns: ['Producto', 'Categoría', 'Sistema', 'Precio', 'Activo'] },
    pedidos: { title: 'Pedidos', singular: 'pedido', columns: ['Pedido ID', 'Fecha y hora', 'Cliente', 'Vendedor', 'Cantidad total', 'Forma de entrega', 'Estado'] },
    presupuestos: { title: 'Presupuestos', singular: 'presupuesto', columns: ['Presupuesto ID', 'Fecha', 'Pedido ID', 'Cliente', 'Total', 'Estado'] },
    remitos: { title: 'Remitos', singular: 'remito', columns: ['Remito ID', 'Fecha', 'Pedido ID', 'Cliente', 'Numero de Remito Via Cargo', 'Seguimiento', 'Estado', 'Origen', 'Revisión'] },
  };
  document.addEventListener('DOMContentLoaded', function () {
    bindShell();
    init();
  });
  function bindShell() {
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.addEventListener('click', function () { navigate(button.dataset.view); });
    });
    document.getElementById('newButton').addEventListener('click', handleNew);
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', function (event) {
      if (event.target === event.currentTarget) closeModal();
    });
    document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeModal(); });
  }
  function init() {
    Promise.all([
      server('getAdminBootstrap'),
      server('getActiveProducts'),
      server('listAdmin', 'clientes')
    ]).then(function (results) {
      state.bootstrap = results[0];
      state.products = results[1];
      state.clients = results[2];
      document.getElementById('today').textContent = state.bootstrap.today;
      renderCurrent();
    }).catch(showError);
  }
  function refresh() {
    return Promise.all([
      server('getAdminBootstrap'),
      server('getActiveProducts'),
      server('listAdmin', 'clientes')
    ]).then(function (results) {
      state.bootstrap = results[0];
      state.products = results[1];
      state.clients = results[2];
      renderCurrent();
    });
  }
  function navigate(view) {
    state.view = view;
    document.querySelectorAll('.nav-item').forEach(function (button) {
      button.classList.toggle('active', button.dataset.view === view);
    });
    renderCurrent();
  }
  function renderCurrent() {
    if (!state.bootstrap) return;
    const isHome = state.view === 'inicio';
    const isInventory = state.view === 'inventario';
    const meta = views[state.view];
    document.getElementById('pageTitle').textContent = isHome ? 'Buen día, Administración' : isInventory ? 'Inventario' : meta.title;
    document.getElementById('pageSubtitle').textContent = isHome ? 'Resumen de hoy' : isInventory ? 'Movimientos de stock' : 'Consulta y gestión de ' + meta.title.toLowerCase();
    updateNewButton();
    if (isHome) renderDashboard();
    else if (isInventory) renderInventory();
    else loadView(state.view);
  }
  function updateNewButton() {
    const button = document.getElementById('newButton');
    const labels = {
      clientes: '＋ Nuevo cliente',
      productos: '＋ Nuevo producto',
      remitos: 'Ver presupuestos',
    };
    // El botón rojo de arriba se saca en: Inicio (el único acceso a "Nuevo
    // pedido" queda en la tile de Accesos rápidos, que redirige a
    // Inventario › Apartado), Inventario (tiene sus propios botones de
    // movimiento), Presupuestos (ya tiene su propio botón "＋ Generar
    // presupuesto" en la barra de la tabla) y Pedidos (los pedidos de
    // implantes ya no se cargan a mano, salen del Apartado en Inventario).
    const oculto = ['inicio', 'inventario', 'presupuestos', 'pedidos'].includes(state.view);
    button.classList.toggle('hidden', oculto);
    button.textContent = labels[state.view] || '＋ Nuevo';
  }
  function handleNew() {
    if (state.view === 'clientes') return openClientForm();
    if (state.view === 'productos') return openProductForm();
    if (state.view === 'presupuestos') return openBudgetFromApartadoPicker();
    if (state.view === 'remitos') return navigate('presupuestos');
  }
  function renderDashboard() {
    const s = state.bootstrap.stats;
    const tasks = state.bootstrap.recent || [];
    document.getElementById('appContent').innerHTML = `
      <section class="metric-grid">
        ${metric('Pedidos recibidos', s.pedidosNuevos, s.pedidosNuevos > 0)}
        ${metric('Presupuestos abiertos', s.presupuestosPendientes)}
        ${metric('Remitos por emitir', s.remitosPendientes)}
      </section>
      <section class="dashboard-grid">
        <article class="panel">
          <div class="panel-header"><h3>Pedidos para revisar</h3><button class="ghost-button" data-go="pedidos">Ver todos</button></div>
          <div class="task-list">
            ${tasks.length ? tasks.map(function (r) {
              return `<button class="task-row ghost-row" data-order="${attr(r['Pedido ID'])}">
                <span><strong>${html(r['Cliente'])}</strong><small>${html(r['Pedido ID'])} · ${html(r['Fecha y hora'])}</small></span>
                <span class="pill ${pillClass(r['Estado'])}">${html(r['Estado'])}</span>
                <span>›</span>
              </button>`;
            }).join('') : empty('No hay pedidos pendientes.')}
          </div>
        </article>
        <article class="panel">
          <div class="panel-header"><h3>Accesos rápidos</h3></div>
          <div class="quick-grid">
            ${quick('cliente', 'Nuevo cliente', 'Registrar datos')}
            ${quick('pedido', 'Nuevo pedido', 'Implantes: vía apartado en Inventario')}
            ${quick('presupuesto', 'Crear presupuesto', 'Desde un pedido apartado')}
            ${quick('remito', 'Emitir remito', 'Completar lotes')}
          </div>
        </article>
      </section>`;
    document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => navigate(b.dataset.go));
    document.querySelectorAll('[data-order]').forEach(b => b.onclick = () => openOrderById(b.dataset.order));
    document.querySelectorAll('[data-quick]').forEach(function (b) {
      b.onclick = function () {
        const action = b.dataset.quick;
        if (action === 'cliente') openClientForm();
        if (action === 'pedido') { navigate('inventario'); invSetMov('apartado'); }
        if (action === 'presupuesto') openBudgetFromApartadoPicker();
        if (action === 'remito') navigate('pedidos');
      };
    });
  }
const STOCK_TIPOS = [
  { id: 'MP', nombre: 'Monopieza (MP)' },
  { id: 'HI', nombre: 'Hexágono Interno Montado - sin tetón (HI)' },
  { id: 'HISM', nombre: 'Hexágono Interno Sin Montar - con tetón (HISM)' },
  { id: 'HE', nombre: 'Hexágono Externo (HE)' },
  { id: 'CM', nombre: 'Cono Morse (CM)' },
  { id: 'CMU', nombre: 'Compresivo Multiunit (CMU)' },
  { id: 'CMU3', nombre: 'Compresivo Multiunit C3 (CMU3)' },
  { id: 'MBT', nombre: 'Monopieza Basal Tratado (MBT)' },
  { id: 'MBP', nombre: 'Monopieza Basal Pulido (MBP)' }
];
const inv = { mov: 'deposito', stock: {}, medidas: {}, stockCargado: false, carrito: [], stockMax: 0 };
function renderInventory() {
  document.getElementById('appContent').innerHTML = `
    <article class="panel">
      <div class="panel-header"><h3>Movimiento de stock</h3></div>
      <div class="form-grid">
        <div class="field full">
          <label>Tipo de movimiento</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="secondary-button inv-mov" data-mov="deposito">Depósito</button>
            <button type="button" class="secondary-button inv-mov" data-mov="salida">Salida (venta)</button>
            <button type="button" class="secondary-button inv-mov" data-mov="apartado">Apartado</button>
          </div>
        </div>
        <div class="field full hidden" id="invApartadosPendientesWrap">
          <p class="section-label" id="invApartadosPendientesLabel">Apartados pendientes</p>
          <div id="invApartadosPendientesBox"></div>
        </div>
        <div id="invManualEntryWrap" style="display:contents">
        <div class="field"><label>Tipo de implante</label>
          <select id="invTipo"><option value="">— Seleccioná —</option>${STOCK_TIPOS.map(t => `<option value="${t.id}">${html(t.nombre)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Medida</label><select id="invMedida"><option value="">— Elegí tipo primero —</option></select></div>
        <div class="field hidden" id="invLoteSelectWrap">
          <label>Lote</label><select id="invLote"><option value="">—</option></select><small id="invStockHint"></small>
        </div>
        <div class="field hidden" id="invLoteTextoWrap">
          <label>Lote</label><input type="text" id="invLoteTexto" placeholder="Ej: Lot-MP-0185">
          <small>Un mismo lote se puede repetir en varias medidas: escribilo una vez, agregá cada medida con su cantidad y quedan todas bajo ese lote. Si ya existe, se suma la cantidad; si no existe, se crea nuevo.</small>
        </div>
        <div class="field"><label>Cantidad</label><input type="number" id="invCantidad" min="1"></div>

// Reinicia TODO el formulario al cambiar de modo, para que nada se traslade entre pestañas

inv.usandoApartado = false;
inv.pedidoPresupuestado = null;
document.getElementById('invApartadoBox').classList.add('hidden');

// Lista todos los clientes con ítems apartados activos ahora mismo (sea o
// no que ya tengan Pedido/Presupuesto generado), para no tener que buscar
// cliente por cliente.
function invRenderApartadosPendientes() {
  const box = document.getElementById('invApartadosPendientesBox');
  box.innerHTML = '<p class="helper">Buscando apartados pendientes…</p>';
  jsonp({ accion: 'obtenerApartadosPorProfesional' }, (err, data) => {
    if (inv.mov !== 'salida' && inv.mov !== 'apartado') return; // el usuario ya cambió de pestaña
    if (err || !(data && data.ok)) {
      box.innerHTML = '<p class="helper">No se pudo cargar la lista de apartados pendientes.</p>';
      return;
    }
    // "Presupuestado" es el estado normal acá — apenas se aparta, el
    // presupuesto se genera solo, así que casi todo lo que aparece en esta
    // lista ya lo va a tener. Eso está bien: tocar el cliente lleva
    // directo a emitir el remito con ese presupuesto. Lo que sí hay que
    // sacar de "pendiente" es lo que YA se remitió/vendió (el remito ya se
    // emitió, no tiene sentido ofrecerlo de nuevo acá).
    server('listAdmin', 'pedidos').then(function (pedidos) {
      const clientesYaRemitidos = new Set(
        pedidos.filter(p => ['Remitido', 'Vendido'].includes(p['Estado'])).map(p => p['Cliente ID'])
      );
      const grupos = (data.profesionales || [])
        .filter(p => p.items && p.items.length)
        .filter(p => !clientesYaRemitidos.has(p.clienteId));
      renderApartadosPendientesLista_(box, grupos);
    }).catch(function () {
      // Si no se pudo traer Pedidos, mejor mostrar la lista sin filtrar
      // que dejar la pantalla en blanco.
      renderApartadosPendientesLista_(box, (data.profesionales || []).filter(p => p.items && p.items.length));
    });
  });
}
function renderApartadosPendientesLista_(box, grupos) {
    if (!grupos.length) {
      box.innerHTML = '<p class="helper">No hay apartados pendientes ahora mismo.</p>';
      return;
    }
    box.innerHTML = grupos.map(function (g) {
      const cliente = state.clients.find(c => c['Cliente ID'] === g.clienteId);
      const nombre = cliente ? cliente['Nombre completo'] : (g.profesional || g.clienteId || 'Cliente');
      const resumen = g.items.map(it => `${it.tipo} ${it.medida} · ${it.cantidad}u`).join(', ');
      // Cada ítem tiene su propia "✕" para eliminarlo puntualmente (la
      // cantidad vuelve al depósito) sin tocar el resto del apartado del
      // cliente — para el caso de "esto al final no se va a vender".
      const itemsDetalle = g.items.map(function (it) {
        return `<div class="task-row ghost-row" style="padding:6px 10px 6px 22px;font-size:12px">
          <span style="color:var(--muted)">${html(it.tipo)} · ${html(it.medida)} · Lote ${html(it.lote)} · ${it.cantidad}u</span>
          <button type="button" class="ghost-button" style="padding:2px 10px;font-size:11px"
            data-del-apartado-cliente="${attr(g.clienteId || '')}" data-del-apartado-prof="${attr(g.profesional || '')}"
            data-del-apartado-tipo="${attr(it.tipo)}" data-del-apartado-medida="${attr(it.medida)}" data-del-apartado-lote="${attr(it.lote)}"
          >✕ Eliminar</button>
        </div>`;
      }).join('');
      return `<div class="task-row ghost-row" style="cursor:pointer" data-apartado-cliente="${attr(g.clienteId || '')}">
        <span><strong>${html(nombre)}</strong><small>${html(resumen)}</small></span>
        <span class="pill warning">${g.items.length} ítem${g.items.length === 1 ? '' : 's'}</span>
      </div>${itemsDetalle}`;
    }).join('');
    box.querySelectorAll('[data-apartado-cliente]').forEach(function (row) {
      row.onclick = () => invSeleccionarApartadoPendiente(row.dataset.apartadoCliente);
    });
    box.querySelectorAll('[data-del-apartado-cliente]').forEach(function (btn) {
      btn.onclick = function (event) {
        event.stopPropagation();
        invEliminarItemApartado(btn.dataset);
      };
    });
}
// Elimina (a 0) un ítem apartado puntual: la cantidad vuelve al depósito

// cantidad), para cuando esas unidades al final no se van a vender.
function invEliminarItemApartado(ds) {
  const detalle = ds.delApartadoTipo + ' ' + ds.delApartadoMedida + ' · Lote ' + ds.delApartadoLote;
  if (!window.confirm('¿Eliminar este ítem apartado (' + detalle + ')? La cantidad vuelve al depósito.')) return;
  jsonp({

    medida: ds.delApartadoMedida,

// Llamada JSONP directa al doGet del archivo de Stock (acciones que NO
// están registradas en FUNCIONES_PANEL, así que no se puede usar server()).
function jsonp(params, cb) {
  var cbName = 'jscbInv_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  var script = document.createElement('script');
  var done = false;
  // Si el Web App no contesta (deployment viejo, sin conexión, error de
  // permisos que devuelve HTML en vez del callback JS), antes esto se
  // quedaba esperando para siempre sin avisar nada. Se corta a los 55s y se
  // avisa el error en vez de dejar todo colgado en blanco (subido de 25s a
  // 55s: operaciones que tocan hojas grandes — como emitir remito, que
  // ahora además cierra el apartado — pueden tardar más de 25s en Apps
  // Script sin que sea un error real).
  var timeoutId = setTimeout(function () {
    if (done) return;
    done = true;
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(new Error('El servidor no respondió a tiempo. Verificá que el Web App de Apps Script esté desplegado con la última versión del código.'), null);
  }, 55000);
  window[cbName] = function (data) {
    if (done) return;
    done = true;
    clearTimeout(timeoutId);
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(null, data);
  };
  script.onerror = function () {
    if (done) return;
    done = true;
    clearTimeout(timeoutId);
    delete window[cbName];
    if (script.parentNode) script.parentNode.removeChild(script);
    cb(new Error('No se pudo conectar con el servidor.'), null);
  };
  var qs = '?callback=' + cbName;
  Object.keys(params).forEach(function (k) {
    qs += '&' + k + '=' + encodeURIComponent(params[k]);
  });
  script.src = URL_API + qs;
  document.body.appendChild(script);
}
function invCargarStock() {
  jsonp({ accion: 'obtenerTodoElStock' }, (err, data) => {
    if (data && data.ok && data.stock) { inv.stock = data.stock; inv.stockCargado = true; }
  });
  // Catálogo completo de medidas por tipo (no filtra por stock > 0) — se
  // usa para el desplegable de Depósito, para que aparezcan también las
  // medidas todavía sin stock cargado.
  jsonp({ accion: 'obtenerMedidasPorTipo' }, (err, data) => {
    if (data && data.ok && data.medidas) { inv.medidas = data.medidas; }
  });
}
function invOnTipo() {
  const tipo = document.getElementById('invTipo').value;
  const selMed = document.getElementById('invMedida');
  selMed.innerHTML = '<option value="">— Seleccioná medida —</option>';
  document.getElementById('invLote').innerHTML = '<option value="">—</option>';
  document.getElementById('invLoteTexto').value = '';
  document.getElementById('invStockHint').textContent = '';
  // Cambiar de tipo de implante a mitad de una carga de depósito invalida
  // las medidas ya agregadas (pertenecen a la hoja del tipo anterior), así
  // que se reinicia el carrito para no mezclar tipos en una misma carga.
  if (inv.mov === 'deposito' && inv.carrito.length) {
    inv.carrito = [];
    invRenderCarrito();
  }
  if (!tipo) return;
  if (inv.mov === 'deposito') {
    // Depósito: se listan TODAS las medidas del catálogo de este tipo,
    // tengan o no stock cargado — para poder recibir una medida nueva o
    // que hoy está en cero. El texto se ve formateado ("Ø3,30 X 8,5mm")
    // pero el valor que viaja al servidor es el crudo (el que matchea la
    // fila real de la hoja).
    const medidas = (inv.medidas && inv.medidas[tipo]) || [];
    medidas.forEach(m => selMed.insertAdjacentHTML('beforeend', `<option value="${attr(m.value)}">${html(m.label)}</option>`));
    return;
  }
  // Salida/Apartado: solo medidas que hoy tienen stock disponible en
  // algún lote (no tendría sentido ofrecer una medida sin nada para vender/apartar).
  if (!inv.stock[tipo]) return;
  const medidasConStock = [...new Set(inv.stock[tipo].map(i => i.medida))];
  medidasConStock.forEach(m => selMed.insertAdjacentHTML('beforeend', `<option value="${attr(m)}">${html(m)}</option>`));
}
function invStockDisponible(tipo, medida, lote) {
  const item = (inv.stock[tipo] || []).find(i => i.medida === medida && i.lote === lote);
  const stockOriginal = item ? item.stock : 0;
  const yaEnCarrito = inv.carrito
    .filter(it => it.tipo_imp === tipo && it.medida === medida && it.lote_sel === lote)
    .reduce((a, it) => a + it.cantidad, 0);
  return stockOriginal - yaEnCarrito;
}
// Solo se usa en Salida/Apartado (Depósito usa el campo de texto libre, no este select)
function invOnMedida() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const selLote = document.getElementById('invLote');
  selLote.innerHTML = '<option value="">— Seleccioná lote —</option>';
  (inv.stock[tipo] || []).filter(i => i.medida === medida).forEach(i => {
    const disp = invStockDisponible(tipo, medida, i.lote);
    if (disp <= 0) return;
    selLote.insertAdjacentHTML('beforeend', `<option value="${attr(i.lote)}">${html(i.lote)} (Disp: ${disp})</option>`);
  });
}
function invOnLote() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const lote = document.getElementById('invLote').value;
  if (!lote) { inv.stockMax = 0; document.getElementById('invStockHint').textContent = ''; return; }
  inv.stockMax = invStockDisponible(tipo, medida, lote);
  document.getElementById('invStockHint').textContent = `Disponible: ${inv.stockMax} u.`;
}
function invAgregarItem() {
  const tipo = document.getElementById('invTipo').value;
  const medida = document.getElementById('invMedida').value;
  const cant = Number(document.getElementById('invCantidad').value) || 0;
  // Depósito: el lote es el campo de texto libre (compartido por todas las
  // medidas de esta carga) y no hay tope de stock — se está agregando
  // stock nuevo, no descontándolo.
  if (inv.mov === 'deposito') {
    const lote = document.getElementById('invLoteTexto').value.trim();
    if (!tipo || !medida) return showError(new Error('Elegí tipo y medida.'));
    if (!lote) return showError(new Error('Escribí el número de lote.'));
    if (cant <= 0) return showError(new Error('Ingresá una cantidad válida.'));
    inv.carrito.push({ tipo_imp: tipo, medida: medida, lote_sel: lote, cantidad: cant });
    invRenderCarrito();
    document.getElementById('invCantidad').value = '';
    document.getElementById('invMedida').value = '';
    return;
  }
  const lote = document.getElementById('invLote').value;
  if (!tipo || !medida || !lote) return showError(new Error('Elegí tipo, medida y lote.'));
  if (cant <= 0 || cant > inv.stockMax) return showError(new Error('Cantidad inválida o mayor al stock disponible (' + inv.stockMax + ').'));
  inv.carrito.push({ tipo_imp: tipo, medida: medida, lote_sel: lote, cantidad: cant });
  invRenderCarrito();
  document.getElementById('invCantidad').value = '';
  invOnMedida();
  document.getElementById('invLote').value = '';
  document.getElementById('invStockHint').textContent = '';
}
function invRenderCarrito() {
  document.getElementById('invCartList').innerHTML = inv.carrito.length
    ? inv.carrito.map((it, idx) => `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(it.tipo_imp)} · ${html(it.medida)} · ${html(it.lote_sel)} · ${it.cantidad}u <button type="button" style="border:none;background:none;color:#c0392b;font-weight:800;margin-left:6px;cursor:pointer" onclick="invQuitarItem(${idx})">×</button></div>`).join('')
    : empty('Sin ítems todavía.');
}
function invQuitarItem(idx) { inv.carrito.splice(idx, 1); invRenderCarrito(); invOnMedida(); }

function invBuscarApartadoCliente(clienteId) {

      }
      // Todavía no se emitió el remito: se cargan solos los ítems del
      // presupuesto en la lista de "Ítems de la venta" (se ocultan la
      // carga manual, pero el botón de abajo queda visible y pasa a
      // emitir el remito + registrar la venta de este mismo presupuesto).
      inv.pedidoPresupuestado = pedido;
      invToggleManualVentaUI_(false, true);
      box.innerHTML = `<div class="pill warning">Este cliente ya está presupuestado${pedido.numero ? ' (N° ' + html(pedido.numero) + ')' : ''}${pedido.total ? ' por ' + money(pedido.total) : ''} — los ítems ya están cargados abajo, apretá "Registrar venta y generar remito" para emitirlo.</div>`;
      document.getElementById('invCartList').innerHTML = '<p class="helper">Cargando ítems del presupuesto…</p>';
      const cargarItemsDelPresupuesto = pedido.numero
        ? server('getDocumentData', 'presupuesto', pedido.numero).then(function (doc) { return doc.items || []; })
        : Promise.resolve([]);
      cargarItemsDelPresupuesto.then(function (items) {
        if (inv.pedidoPresupuestado !== pedido) return; // el usuario ya cambió de cliente mientras cargaba
        document.getElementById('invCartList').innerHTML = items.length
          ? items.map(i => `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(i['Producto'] || '')} · ${html(i['Cantidad'])}u${i['Lote'] ? ' · Lote ' + html(i['Lote']) : ''}</div>`).join('')
          : empty('Sin ítems.');
      }).catch(function () {
        if (inv.pedidoPresupuestado !== pedido) return;
        document.getElementById('invCartList').innerHTML = '<p class="helper">No se pudieron cargar los ítems del presupuesto.</p>';
      });
      return;
    }
    invBuscarApartadoCrudo(clienteId, box);
  }).catch(function () { invBuscarApartadoCrudo(clienteId, box); });
}

function invBuscarApartadoCrudo(clienteId, box) {
  jsonp({ accion: 'obtenerApartadosPorProfesional' }, (err, data) => {
    const grupo = (data && data.ok) ? data.profesionales.find(p => p.clienteId === clienteId) : null;
    if (!grupo || !grupo.items.length) {
      box.classList.add('hidden');
      box.innerHTML = '';
      inv.apartadoActivo = null;
      inv.usandoApartado = false;
      inv.pedidoPresupuestado = null;
      // Este cliente no tiene ningún apartado activo: acá sí corresponde
      // la carga manual (venta directa de stock, sin apartado de por medio).
      invToggleManualVentaUI_(true);
      invRenderCarrito();
      return;
    }
    inv.apartadoActivo = grupo;
    inv.pedidoPresupuestado = null;
    // Ya no hay atajo para "cargar directo a la venta": el circuito
    // siempre pasa por generar el presupuesto primero — recién desde ahí
    // (o desde Remitos) se emite el remito y se registra la venta. Se
    // oculta la carga manual acá también, y también el botón de abajo (no
    // hay nada para "registrar" todavía, primero hay que generar el
    // presupuesto), para no dejar caminos a medio armar.
    invToggleManualVentaUI_(false, false);
    document.getElementById('invCartList').innerHTML = grupo.items.map(it => `<div class="pill neutral" style="margin:3px 6px 3px 0;display:inline-flex">${html(it.tipo)} · ${html(it.medida)} · ${html(it.lote)} · ${it.cantidad}u</div>`).join('');
    box.innerHTML = `
      <div class="pill warning" style="margin-bottom:8px">Este cliente tiene un apartado activo — todavía sin presupuesto. Los ítems ya se muestran abajo; generá el presupuesto para poder emitir el remito y registrar la venta.</div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="primary-button" id="invGenerarPresupuesto">Generar presupuesto para este apartado</button>
      </div>`;

  });
}

// Registra el apartado y, automáticamente (sin pasos intermedios), genera
// el presupuesto de ese apartado y lo abre listo para imprimir. La
// ventana de impresión se abre YA, en el mismo click, para que el
// navegador no la bloquee — recién se completa cuando el presupuesto
// está listo. Si algo del presupuesto falla, el apartado igual queda
// registrado: se avisa y se puede generar el presupuesto a mano después
// desde Presupuestos (donde también se puede editar y reimprimir las
// veces que haga falta).
function invSubmitApartado() {
  if (!inv.carrito.length) return showError(new Error('Agregá al menos un ítem.'));
  const clientId = document.getElementById('invClienteId').value;
  const params = {
    accion: 'registrarApartadoMultiple',
    items_json: JSON.stringify(inv.carrito),
    observacion: 'Cargado desde Panel'
  };
  if (clientId) {
    params.clienteId = clientId;
    const client = state.clients.find(c => c['Cliente ID'] === clientId);
    params.profesional = client ? client['Nombre completo'] : '';
  } else {
    const nombre = document.getElementById('invNombre').value.trim();
    if (!nombre) return showError(new Error('Elegí un cliente existente o cargá los datos de uno nuevo.'));
    params.cliente_json = JSON.stringify({
      'Nombre': nombre,
      'Apellido': document.getElementById('invApellido').value.trim(),
      'CUIL': document.getElementById('invCuil').value.trim(),
      'Localidad': document.getElementById('invLocalidad').value.trim()
    });
  }
  document.getElementById('invSubmit').disabled = true;
  jsonp(params, (err, data) => {
    // Todo el manejo de la respuesta va en try/catch: si algo inesperado
    // tira una excepción acá, antes se perdía en silencio. Ahora se avisa
    // el error directamente, sin ventana de impresión de por medio.
    try {
      if (err) {
        document.getElementById('invSubmit').disabled = false;
        return showError(err);
      }
      if (!(data && data.ok)) {
        document.getElementById('invSubmit').disabled = false;
        return showError(new Error(data ? (data.error || data.mensaje) : 'No hubo respuesta.'));
      }
      showToast('Apartado registrado.');
      inv.stockCargado = false;
      const orderId = data.orderId;
      if (!orderId) {
        renderInventory();
        return;
      }
      // El presupuesto se genera solo, pero NO se imprime en el momento:
      // el usuario lo revisa/ajusta (por ejemplo aplica un descuento, o
      // corrige un lote) desde Presupuestos y recién ahí imprime/genera
      // el PDF cuando ya está todo ok — ese PDF es el que queda guardado
      // en Drive junto con el remito y el comprobante de esa misma venta.
      server('crearPresupuestoDesdeApartado', { orderId: orderId })
        .then(function () {
          showToast('Presupuesto generado. Revisalo, aplicá descuentos si hace falta e imprimilo desde Presupuestos cuando esté listo.');
          renderInventory();
          refresh();
        })
        .catch(function (err2) {
          showToast('El apartado se registró, pero no se pudo generar el presupuesto automáticamente: ' +
            (err2 && err2.message ? err2.message : err2) + '. Podés generarlo manualmente desde Presupuestos.', true);
          renderInventory();
          refresh();
        });
    } catch (ex) {
      document.getElementById('invSubmit').disabled = false;
      showError(ex);
    }
  });
}

  // Arma los ítems del remito (producto, cantidad y lote) a partir del
  // Presupuesto vinculado a este pedido, NO de Pedido Detalle: el remito
  // debe reflejar exactamente lo que quedó en el presupuesto — incluidos
  // componentes/instrumental que no tienen control de stock por lote (no
  // aparecen en Inventario > Apartado). Si el pedido no tiene presupuesto
  // (circuito viejo/manual, por ejemplo un remito armado antes de este
  // cambio), se arma igual como antes, a partir de Pedido Detalle.
  function prepararItemsRemitoDesdeOrder_(order) {
    return server('listAdmin', 'presupuestos').then(function (presupuestos) {
      const delPedido = presupuestos.filter(b => b['Pedido ID'] === order['Pedido ID']);
      const presupuesto = delPedido.length ? delPedido[0] : null; // listAdmin devuelve el más reciente primero
      if (!presupuesto) {
        return (order.items || []).map(function (i) {
          return { productId: i['Producto ID'], codigo: i['Código'], producto: i['Producto'], quantity: toNumber(i['Cantidad']), lot: i['Lote'] || '' };
        });
      }
      return server('getDocumentData', 'presupuesto', presupuesto['Presupuesto ID']).then(function (doc) {
        return (doc.items || []).map(function (i) {
          return { productId: i['Producto ID'], codigo: i['Código'], producto: i['Producto'], quantity: toNumber(i['Cantidad']), lot: i['Lote'] || '' };
        });
      });
    });
  }
  // Crear presupuesto: lista los Pedidos armados desde un apartado
  // (Inventario > Apartado los crea/actualiza solos vía
  // sincronizarPedidoDesdeApartado_), autocompleta cliente/tipo de cliente
  // y precio sugerido + lote por implante, deja tocar el precio y el lote
  // a mano, permite descuento (porcentaje o importe fijo) + observaciones,
  // y muestra el total final en vivo. Se usa como generador manual/de
  // respaldo — el flujo normal (Inventario > Apartado) ya genera e
  // imprime el presupuesto solo; esta pantalla sirve para pedidos de
  // apartado viejos o si el paso automático falló, y para presupuestos de

  function openBudgetFromApartadoPicker(preselectClienteId) {

        const items = pedido.items.map((it, idx) => ({

        }));

  function renderApartadoBudgetBody(pedido) {

      </div>
      ${selectField('discountType', ['Porcentaje', 'Importe'], 'Porcentaje', false, false, 'Tipo de descuento')}
      ${field('discountValue', 0, false, false, 'number', 'Descuento')}

  function updateApartadoBudgetTotal() {
    const totalEl = document.getElementById('apartadoBudgetTotal');
    if (!totalEl) return;
    const qtys = Array.from(document.querySelectorAll('.apartado-item-qty')).map(i => Number(i.value) || 0);
    const prices = Array.from(document.querySelectorAll('.apartado-item-price')).map(i => Number(i.value) || 0);
    const subtotal = qtys.reduce((sum, qty, idx) => sum + qty * (prices[idx] || 0), 0);
    const discountType = document.querySelector('#apartadoBudgetBody select[name="discountType"]');
    const discountValue = document.querySelector('#apartadoBudgetBody input[name="discountValue"]');
    const dType = discountType ? discountType.value : 'Porcentaje';
    const dValue = discountValue ? Number(discountValue.value) || 0 : 0;
    const discountAmount = dType === 'Importe' ? Math.min(dValue, subtotal) : subtotal * Math.min(dValue, 100) / 100;
    totalEl.textContent = money(Math.max(0, subtotal - discountAmount));
  }

  // Número de remito Via Cargo: prefijo de agencia (4 dígitos, entre 5090 y
  // 9090, elegible de una lista) + el resto del número, que se escribe a
  // mano — es un dato DISTINTO del número de seguimiento (que es un campo
  // libre aparte). Estos helpers arman/leen/parsean ese par de campos y se
  // reusan en "Emitir remito" y en "Editar remito".
  const VIA_CARGO_PREFIJOS_ = ['5090','9090'];
  function viaCargoCamposHtml_(prefijoActual, restoActual) {
    const prefijoConocido = VIA_CARGO_PREFIJOS_.indexOf(prefijoActual) !== -1;
    const prefijoManual = !!prefijoActual && !prefijoConocido;
    return `<div class="field full">
      <label>Número de remito Via Cargo (opcional)</label>
      <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:0 0 130px">
          <select id="viaCargoPrefijo">
            <option value="">— Prefijo —</option>
            ${VIA_CARGO_PREFIJOS_.map(p => `<option value="${p}" ${p === prefijoActual ? 'selected' : ''}>${p}</option>`).join('')}
            <option value="__otro__" ${prefijoManual ? 'selected' : ''}>Otro…</option>
          </select>
          <input type="text" id="viaCargoPrefijoManual" class="${prefijoManual ? '' : 'hidden'}" value="${attr(prefijoManual ? prefijoActual : '')}" maxlength="4" placeholder="Ej: 5090" style="margin-top:4px;width:100%">
        </div>
        <input type="text" id="viaCargoResto" value="${attr(restoActual || '')}" placeholder="Resto del número" style="flex:1;min-width:140px">
      </div>
      <small style="color:var(--muted)">Prefijo de agencia (entre 5090 y 9090) + el resto del número, a mano.</small>
    </div>`;
  }
  function wireViaCargoCampos_() {
    const select = document.getElementById('viaCargoPrefijo');
    const manual = document.getElementById('viaCargoPrefijoManual');
    if (!select) return;
    select.onchange = function () {
      if (select.value === '__otro__') { manual.classList.remove('hidden'); manual.focus(); }
      else { manual.classList.add('hidden'); manual.value = ''; }
    };
  }
  function leerViaCargoNumero_() {
    const select = document.getElementById('viaCargoPrefijo');
    if (!select) return '';
    const manual = document.getElementById('viaCargoPrefijoManual');
    const resto = document.getElementById('viaCargoResto');
    const prefijo = select.value === '__otro__' ? (manual ? manual.value.trim() : '') : select.value;
    const restoVal = resto ? resto.value.trim() : '';
    return (prefijo || '') + restoVal;
  }
  function parseViaCargoNumero_(valor) {
    valor = String(valor || '').trim();
    if (!valor) return { prefijo: '', resto: '' };
    const prefijo4 = valor.slice(0, 4);
    if (VIA_CARGO_PREFIJOS_.indexOf(prefijo4) !== -1) return { prefijo: prefijo4, resto: valor.slice(4) };
    // Prefijo no reconocido (remito viejo, u otro formato): se deja todo
    // en "resto" en vez de inventar un corte que capaz no corresponde.
    return { prefijo: '', resto: valor };
  }
  // Emitir remito: parte de un Pedido ya presupuestado. Cliente/fecha se
  // autocompletan desde el pedido, y los PRODUCTOS (producto, cantidad y
  // lote) se autocompletan desde el PRESUPUESTO de ese pedido —
  // prepararItemsRemitoDesdeOrder_ ya los resolvió antes de abrir este
  // modal, y acá no se pueden agregar/quitar/editar: ese paso se hace en
  // el Presupuesto (o en el Apartado, en Inventario), nunca al emitir o
  // editar el remito. Deja "Forma de entrega" y "Aclaración" para
  // completar a mano, y al confirmar: genera el remito con número
  // correlativo único, arma el PDF con la plantilla Bio-Fix (RemitoPDF.gs)
  // y lo guarda en la carpeta de Drive "Ventas Bio-Fix" — además lo abre
  // en una pestaña nueva para poder imprimirlo al toque. En el mismo paso
  // el remito y el pedido quedan marcados como VENDIDO y el stock que
  // corresponda se descuenta — emitir el remito ya es "vender".
  function openEmitirRemitoForm(order, items) {
    items = (items || (order.items || []).map(function (i) {
      return { productId: i['Producto ID'], codigo: i['Código'], producto: i['Producto'], quantity: toNumber(i['Cantidad']), lot: i['Lote'] || '' };
    }));
    openModal('Emitir remito · Pedido ' + order['Pedido ID'], `<form class="form-grid" id="emitirRemitoForm">
      <div class="field"><label>Cliente</label><strong>${html(order['Cliente'])}</strong></div>
      <div class="field"><label>Fecha</label><strong>${html(todayIso())}</strong></div>
      ${selectField('delivery', ['Retiro por sucursal Via Cargo', 'Retiro en Fábrica'], '', true, false, 'Tipo de entrega')}
      ${viaCargoCamposHtml_('', '')}
      ${field('tracking', '', false, false, 'text', 'Número de seguimiento (opcional)')}
      ${textareaField('notes', '', true, 'Aclaración (opcional) — texto libre, no se completa solo con los productos')}
      <p class="section-label">Productos · tomados del presupuesto (no se pueden editar acá)</p>
      <div class="table-wrap field full"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Lote</th></tr></thead><tbody id="emitirRemitoItemsBody">
        ${items.map(i => `<tr><td>${html(i.producto)}</td><td>${html(i.quantity)}</td><td>${html(i.lot || '—')}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="field full"><p style="color:var(--muted);font-size:12px">El número de remito se genera solo y no se repite. Si un producto, cantidad o lote está mal, corregilo en el Presupuesto (o en el Apartado, en Inventario) y volvé a emitir el remito. Si cargás el número de Via Cargo, queda guardado en el remito y también en el historial de Movimientos. Al confirmar se guarda el PDF en Drive (carpeta "Ventas Bio-Fix"), se abre para imprimir, y el remito/pedido quedan marcados como Vendido con el stock ya descontado.</p></div>
      ${actions('Emitir remito')}
    </form>`);
    wireViaCargoCampos_();
    // Red de seguridad: si algún ítem quedó sin lote en el presupuesto
    // (por ejemplo porque se generó antes de este cambio, o el usuario lo
    // dejó en blanco a propósito), se intenta completar contra el
    // apartado ACTUAL del cliente (getLotesApartadoPorPedido,
    // PedidosApartadoSync.gs) matcheado por Producto ID. Solo completa lo
    // que esté vacío — nunca pisa un lote que ya vino del presupuesto.
    jsonp({ accion: 'getLotesApartadoPorPedidoDirecto', orderId: order['Pedido ID'] }, function (err, data) {
      if (err || !data || !data.ok || !data.lotes) return;
      let huboCambios = false;
      items.forEach(function (i) {
        if (!i.lot && i.productId && data.lotes[i.productId]) { i.lot = data.lotes[i.productId]; huboCambios = true; }
      });
      if (huboCambios) {
        document.getElementById('emitirRemitoItemsBody').innerHTML =
          items.map(i => `<tr><td>${html(i.producto)}</td><td>${html(i.quantity)}</td><td>${html(i.lot || '—')}</td></tr>`).join('');
      }
    });
    document.getElementById('emitirRemitoForm').onsubmit = function (event) {
      event.preventDefault();
      const raw = formObject(event.target);
      if (!raw.delivery) return showError(new Error('Elegí el tipo de entrega.'));
      const submitButton = event.target.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Emitiendo…';
      const trackingVal = (raw.tracking || '').trim();
      const viaCargoVal = leerViaCargoNumero_();
      server('createRemitFromOrder', { orderId: order['Pedido ID'], date: todayIso(), viaCargoRemito: viaCargoVal, tracking: trackingVal, notes: raw.notes, items: items })
        .then(function (created) {
          // createRemitFromOrder trae "Forma de entrega" del Pedido; acá la
          // pisamos con lo que se completó a mano al emitir el remito. El
          // número de remito Via Cargo cargado acá es lo que updateRemit
          // propaga a la columna "Remito Via Cargo" de Movimientos
          // (sincronizarViaCargoEnMovimientos_, BackendPanel.gs) — solo si
          // el tipo de entrega es Via Cargo. El número de seguimiento es
          // un dato aparte, no se usa para eso. No se mandan "items" acá:
          // updateRemit ya no los acepta (ver openEditRemit más abajo).
          return server('updateRemit', {
            remitId: created.id, date: todayIso(), delivery: raw.delivery, address: suggestedAddressForDelivery_(raw.delivery),
            viaCargoRemito: viaCargoVal, tracking: trackingVal, notes: raw.notes
          }).then(function () { return created; });
        })
        .then(function (created) {
          return server('generarRemitoPDF', created.id).then(function (pdf) { return { created: created, pdf: pdf }; });
        })
        .then(function (result) {
          closeModal();
          showToast('Remito ' + result.created.id + ' emitido y marcado como vendido.');
          if (result.pdf && result.pdf.url) window.open(result.pdf.url, '_blank');
          refresh();
        })
        .catch(function (err) {

      <button class="print" onclick="window.print()">${isBudget ? 'Guardar presupuesto en PDF' : 'Imprimir remito'}</button>
      <header><div>${s['Logo URL'] ? `<img src="${attr(s['Logo URL'])}" alt="Bio-Fix" style="max-height:48px;max-width:220px;display:block;margin-bottom:6px">` : `<span class="label" style="font-size:20px;font-weight:bold;color:#245d6b">${html(s.Empresa || 'Bio-Fix')}</span>`}<h1>${title} N.º ${html(number)}</h1></div><div class="company"><strong>${html(s['Razón social'] || 'Grado Cuatro S.R.L.')}</strong><br>${html(s['Dirección'] || '')}<br>${html(s['Localidad'] || '')}</div></header>
      <section class="info"><div class="box"><span class="label">Información del cliente</span><p><strong>${html(h['Cliente'])}</strong></p>${isBudget && c['Empresa'] ? `<p>${html(c['Empresa'])}</p>` : ''}<p>CUIL: ${html(c['CUIL'] || '')}</p><p>${html(c['Localidad'] || '')} · ${html(c['Provincia'] || '')}</p>${isBudget ? `<p>${html(c['Teléfono'] || '')} ${c['Teléfono'] && c['Email'] ? '·' : ''} ${html(c['Email'] || '')}</p>` : ''}</div>
      <div class="box"><span class="label">${isBudget ? 'Enviar a' : 'Entrega'}</span><p><strong>${html(h['Dirección de entrega'] || '')}</strong></p><p>${html(c['Localidad'] || '')} ${html(c['Código postal'] || '')}</p><p>${html(c['Provincia'] || '')}</p>${isBudget ? `<p>${html(c['Teléfono'] || '')} ${c['Teléfono'] && c['Email'] ? '·' : ''} ${html(c['Email'] || '')}</p>` : ''}</div>
      <div class="box"><span class="label">Fecha</span><p><strong>${html(h['Fecha'])}</strong></p>${isBudget ? '' : `<p>Pedido: ${html(h['Pedido ID'] || '')}</p>`}</div>
      ${isBudget ? '' : `<div class="box"><span class="label">N.° remito Via Cargo</span><p>${html(h['Numero de Remito Via Cargo'] || '')}</p></div><div class="box"><span class="label">N.° de seguimiento</span><p>${html(h['Seguimiento'] || '')}</p></div>`}</section>
      <table><thead><tr><th>Descripción</th><th>Cantidad</th>${isBudget ? '<th>Precio unitario</th><th>Total</th>' : '<th>Lote</th>'}</tr></thead><tbody>${rows}</tbody></table>
      ${isBudget ? `<div class="totals"><p><span>Subtotal</span><strong>${money(h['Subtotal'])}</strong></p><p><span>Descuento</span><strong>${money(h['Descuento importe'])}</strong></p><p><span>Subtotal menos descuento</span><strong>${money(subtotalAfterDiscount)}</strong></p><p class="grand"><span>Total</span><strong>${money(h['Total'])}</strong></p></div><p style="text-align:right;color:#5f7076;font-size:11px">Importes expresados en pesos argentinos (ARS).</p>` : ''}
      <div class="box notes"><span class="label">Observaciones / notas</span><p>${html(h['Observaciones'] || '')}</p></div>
      </body></html>`;
  }
  function openModal(title, body) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalContent').innerHTML = body;
    document.getElementById('modalBackdrop').classList.remove('hidden');
  }
  function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); document.getElementById('modalContent').innerHTML = ''; }
  function field(name, value, required, full, type, label) {
    return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><input name="${attr(name)}" type="${type || 'text'}" value="${attr(value || '')}" ${required ? 'required' : ''} ${type === 'number' ? 'min="0" step="0.01"' : ''}></div>`;
  }
  function hidden(name, value) { return `<input type="hidden" name="${attr(name)}" value="${attr(value || '')}">`; }
  function textareaField(name, value, full, label) { return `<div class="field ${full === false ? '' : 'full'}"><label>${html(label || name)}</label><textarea name="${attr(name)}">${html(value || '')}</textarea></div>`; }
  function selectField(name, options, selected, required, full, label) {
    const normalized = options.map(o => typeof o === 'string' ? {value:o,label:o} : o);
    return `<div class="field ${full ? 'full' : ''}"><label>${html(label || name)}${required ? ' *' : ''}</label><select name="${attr(name)}" ${required ? 'required' : ''}><option value="">Seleccionar…</option>${normalized.map(o => `<option value="${attr(o.value)}" ${String(o.value) === String(selected) ? 'selected' : ''}>${html(o.label)}</option>`).join('')}</select></div>`;
  }
  function actions(label) { return `<div class="form-actions"><button type="button" class="secondary-button" onclick="closeModal()">Cancelar</button><button type="submit" class="primary-button">${html(label || 'Guardar')}</button></div>`; }
  function formObject(form) { return Object.fromEntries(new FormData(form).entries()); }
  function metric(label, value, urgent) { return `<article class="metric-card ${urgent ? 'urgent' : ''}"><span class="metric-label">${html(label)}</span><strong class="metric-value">${html(value)}</strong></article>`; }
  function quick(action, title, subtitle) { return `<button class="quick-action" data-quick="${action}">${html(title)}<small>${html(subtitle)}</small></button>`; }
  function empty(message) { return `<div class="empty-state"><strong>${html(message)}</strong><span>El sistema se actualizará cuando haya movimientos.</span></div>`; }
  function loading() { return '<div class="loading-card"><div class="spinner"></div><p>Cargando información…</p></div>'; }
  function findRecord(moduleKey, fieldName, id) { return (state.records[moduleKey] || state.clients || []).find(r => String(r[fieldName]) === String(id)); }
  function cell(column, value) {
    if (/Precio|Importe|Subtotal|Total/.test(column)) return `<span class="amount">${money(value)}</span>`;
    if (column === 'Estado' || column === 'Revisión' || column === 'Activo') return `<span class="pill ${pillClass(value)}">${html(value || '-')}</span>`;
    const text = String(value || '-');
    return html(text.length > 95 ? text.slice(0, 95) + '…' : text);
  }
  function pillClass(value) {
    const v = normalize(value);
    if (['recibido','en revision','borrador','enviado','preparado','despachado','apartado','pendiente','pendiente de pago'].includes(v) || v.includes('revisar')) return 'warning';
    if (['aprobado','remitido','entregado','vendido','saldado','activo','si'].includes(v)) return 'success';
    return 'neutral';
  }
  function money(value) { return new Intl.NumberFormat('es-AR', {style:'currency',currency:'ARS',maximumFractionDigits:2}).format(toNumber(value)); }
  function budgetLinePrice(source, matchedProduct) {
    const hasSavedPrice = source['Precio unitario'] !== undefined || source.price !== undefined;
    const savedPrice = toNumber(source['Precio unitario'] !== undefined ? source['Precio unitario'] : source.price);
    const catalogPrice = toNumber(matchedProduct && matchedProduct.precio);
    if (hasSavedPrice && savedPrice > 0 && savedPrice < 1000 && catalogPrice >= 1000) return catalogPrice;
    if (hasSavedPrice) return savedPrice;
    return catalogPrice || '';
  }
  function toNumber(value) {
    if (typeof value === 'number') return value;
    let t = String(value || '').replace(/\$/g,'').replace(/\s/g,'');
    if (!t) return 0;
    const hasComma = t.includes(',');
    const hasDot = t.includes('.');
    if (hasComma && hasDot) {
      t = t.lastIndexOf(',') > t.lastIndexOf('.')
        ? t.replace(/\./g,'').replace(',','.')
        : t.replace(/,/g,'');
    } else if (hasComma) {
      t = /^-?\d{1,3}(,\d{3})+$/.test(t) ? t.replace(/,/g,'') : t.replace(',','.');
    } else if (hasDot && /^-?\d{1,3}(\.\d{3})+$/.test(t)) {
      t = t.replace(/\./g,'');
    }
    return Number(t) || 0;
  }
  function normalize(value) { return String(value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
  function todayIso() { return new Date().toISOString().slice(0,10); }
  function inputDate(value) {
    const text = String(value || '').trim();
    if (/^\d{4}-\d{2}-\d{2}/.test(text)) return text.slice(0, 10);
    const match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    return match ? `${match[3]}-${match[2].padStart(2,'0')}-${match[1].padStart(2,'0')}` : todayIso();
  }
  function addDays(iso, days) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); }
  function provinces() { return ['Buenos Aires','Ciudad Autónoma de Buenos Aires','Catamarca','Chaco','Chubut','Córdoba','Corrientes','Entre Ríos','Formosa','Jujuy','La Pampa','La Rioja','Mendoza','Misiones','Neuquén','Río Negro','Salta','San Juan','San Luis','Santa Cruz','Santa Fe','Santiago del Estero','Tierra del Fuego, Antártida e Islas del Atlántico Sur','Tucumán']; }
  function html(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])); }
  function attr(value) { return html(value); }
  function showToast(message, error) {
    const toast = document.getElementById('toast');
    toast.textContent = message; toast.classList.toggle('error', !!error); toast.classList.remove('hidden');
    clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.add('hidden'), 3500);
  }
  function showError(error) { showToast(error && error.message ? error.message : 'Ocurrió un error.', true); console.error(error); }
  function server(name, ...args) {
  return new Promise(function (resolve, reject) {
    var cbName = 'jscbPanel_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    var script = document.createElement('script');
    var done = false;
    // Mismo motivo que en jsonp(): sin esto, un Web App desplegado viejo o
    // sin permisos deja la promesa colgada para siempre (ventanas de
    // impresión en blanco, botones que no vuelven a habilitarse, etc.)
    // sin ningún aviso.
    var timeoutId = setTimeout(function () {
      if (done) return;
      done = true;
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('El servidor no respondió a tiempo (' + name + '). Verificá que el Web App de Apps Script esté desplegado con la última versión del código.'));
    }, 55000);
    window[cbName] = function (data) {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      if (data && data.ok) {
        resolve('data' in data ? data.data : data);
      } else {
        reject(new Error(data && data.error ? data.error : 'Error de servidor.'));
      }
    };
    script.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('No se pudo conectar con el servidor.'));
    };
    var qs = '?callback=' + cbName
      + '&accion=' + encodeURIComponent(name)
      + '&args=' + encodeURIComponent(JSON.stringify(args));
    script.src = URL_API + qs;
    document.body.appendChild(script);
  });
}
</script>
